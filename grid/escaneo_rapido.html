<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Escaneo Rápido · XMT1</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23000'/><path d='M6 10 L6 8 L8 8M24 8 L26 8 L26 10M26 22 L26 24 L24 24M8 24 L6 24 L6 22' stroke='%23fff' stroke-width='2' stroke-linecap='round' fill='none'/><line x1='11' y1='16' x2='21' y2='16' stroke='%23fff' stroke-width='2' stroke-linecap='round'/></svg>">

  <style>
    @font-face {
      font-family: 'ProximaNova';
      src: url('../legacy/data/proximanovaregular.otf') format('opentype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'ProximaNova';
      src: url('../legacy/data/proximanovabold.otf') format('opentype');
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --bg:          #000000;
      --surface:     #1c1c1e;
      --text:        #ffffff;
      --text-muted:  #8e8e93;
      --success:     #34c759;
      --error:       #ff453a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'ProximaNova', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    html, body { height: auto; } /* allow log to scroll */

    /* ── Layout principal ── */
    .scanner-screen {
      min-height: 60dvh;
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 32px 28px;
      cursor: default;
      user-select: none;
    }

    /* ── Ícono de paquete ── */
    .package-icon {
      margin-bottom: 40px;
      color: var(--text);
      transition: color 0.3s ease;
    }

    .package-icon svg {
      width: 96px;
      height: 96px;
      display: block;
    }

    .package-icon.idle {
      animation: icon-float 4s ease-in-out infinite;
    }

    .package-icon.processing {
      color: var(--text-muted);
      animation: icon-processing 0.8s ease-in-out infinite alternate;
    }

    @keyframes icon-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    @keyframes icon-processing {
      from { opacity: 1; }
      to   { opacity: 0.45; }
    }

    /* ── Texto ── */
    .screen-label {
      font-size: 28px;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.25;
      margin-bottom: 2px;
    }

    .screen-label-strong {
      font-size: 44px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    /* ── Área de estado ── */
    .status {
      margin-top: 40px;
      min-height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-muted);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s ease, transform 0.2s ease, color 0.18s ease;
    }

    .status.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .status.success { color: var(--success); }
    .status.error   { color: var(--error);   }

    .status-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Último código escaneado ── */
    .last-code {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
      opacity: 0;
      transition: opacity 0.3s ease 0.1s;
    }

    .last-code.visible { opacity: 0.55; }

    /* ── Input HID: en pantalla pero invisible, necesario para autofocus ── */
    #hidInput {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 0;
      overflow: hidden;
      border: 0; outline: 0; padding: 0; margin: 0;
      opacity: 0;
      pointer-events: none;
      font-size: 16px; /* evita zoom en iOS */
    }

    /* Indicador de foco: puntito en esquina sup-derecha */
    #focusIndicator {
      position: fixed;
      top: 10px; right: 10px;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #2c2c2e;
      transition: background 0.3s;
      z-index: 100;
    }
    #focusIndicator.armed { background: var(--success); }

    /* ── Log panel ── */
    .log-panel {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 0 16px 40px;
    }

    .log-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 4px 12px;
      border-top: 1px solid #1c1c1e;
      margin-bottom: 12px;
    }

    .log-header h2 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      flex: 1;
    }

    .log-badge {
      background: #1c1c1e;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      min-width: 24px;
      text-align: center;
      transition: background 0.2s, color 0.2s;
    }

    .log-badge.has-entries {
      background: #2c2c2e;
      color: var(--text);
    }

    .log-clear-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }

    .log-clear-btn:hover { color: var(--error); background: rgba(255,69,58,.1); }

    /* Log entries */
    .log-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-empty {
      text-align: center;
      color: #3a3a3c;
      font-size: 13px;
      padding: 24px 0;
    }

    .log-entry {
      background: #1c1c1e;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: entry-in 0.22s ease;
    }

    @keyframes entry-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .log-entry.error { background: rgba(255,69,58,.1); }

    .log-entry-num {
      font-size: 11px;
      color: #3a3a3c;
      font-variant-numeric: tabular-nums;
      min-width: 22px;
      text-align: right;
    }

    .log-entry-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
    }

    .log-entry.error .log-entry-dot { background: var(--error); }

    .log-entry-body {
      flex: 1;
      min-width: 0;
    }

    .log-entry-code {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log-entry-raw {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log-entry-time {
      font-size: 11px;
      color: #48484a;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Input HID: autofocus + height:0 = invisible pero enfocable desde carga -->
  <input id="hidInput" type="text" autofocus
         autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
         aria-label="Lector de código de barras" tabindex="0">

  <!-- Punto verde = listo para escanear, gris = sin foco -->
  <div id="focusIndicator"></div>

  <main class="scanner-screen" id="scannerScreen">

    <div class="package-icon idle" id="packageIcon">
      <!--
        Caja isométrica con línea de cinta central.
        viewBox 64×64 — trazos stroke-width 1.8 (estilo Nocturne).

        Cara superior (rombo): vértices  top(32,8)  right(56,22)  front(32,36)  left(8,22)
        Cara izquierda:        left(8,22) → front(32,36) → base-front(32,56) → base-left(8,42)
        Cara derecha:          front(32,36) → right(56,22) → base-right(56,42) → base-front(32,56)
        Cinta de sellado:      línea vertical x=32, de y=8 a y=56
      -->
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Cara superior -->
        <path d="M32 8 L56 22 L32 36 L8 22 Z"
              stroke="currentColor" stroke-width="1.8"
              stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Cara izquierda -->
        <path d="M8 22 L32 36 L32 56 L8 42 Z"
              stroke="currentColor" stroke-width="1.8"
              stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Cara derecha -->
        <path d="M32 36 L56 22 L56 42 L32 56 Z"
              stroke="currentColor" stroke-width="1.8"
              stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Cinta de sellado — línea central vertical -->
        <line x1="32" y1="8" x2="32" y2="56"
              stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round"/>
      </svg>
    </div>

    <p class="screen-label">Escanea un</p>
    <strong class="screen-label-strong">paquete</strong>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="lastCode" class="last-code"></div>

  </main>

  <!-- ── Log panel ── -->
  <section class="log-panel">
    <header class="log-header">
      <h2>Log de escaneos</h2>
      <span class="log-badge" id="logBadge">0</span>
      <button class="log-clear-btn" onclick="clearLog()">Limpiar</button>
    </header>

    <ul class="log-list" id="logList">
      <li class="log-empty" id="logEmpty">Sin escaneos aún</li>
    </ul>
  </section>


  <script>
    const hidInput       = document.getElementById('hidInput');
    const focusIndicator = document.getElementById('focusIndicator');
    const statusEl       = document.getElementById('status');
    const lastCodeEl     = document.getElementById('lastCode');
    const packageIcon    = document.getElementById('packageIcon');
    const logList        = document.getElementById('logList');
    const logEmpty       = document.getElementById('logEmpty');
    const logBadge       = document.getElementById('logBadge');

    const ICON_CHECK = `<svg class="status-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,10 8,14 16,6"/></svg>`;
    const ICON_X     = `<svg class="status-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="5" x2="15" y2="15"/><line x1="15" y1="5" x2="5" y2="15"/></svg>`;
    const ICON_SPIN  = `<div class="spinner"></div>`;

    let scanCount = 0;

    // ── Log ───────────────────────────────────────────────────────────────
    function addLogEntry(id, rawCode, isError, errorMsg) {
      scanCount++;
      logEmpty.style.display = 'none';

      const now   = new Date();
      const time  = now.toLocaleTimeString('es-MX', { hour12: false });
      const isDiff = rawCode !== id;

      const li = document.createElement('li');
      li.className = `log-entry${isError ? ' error' : ''}`;
      li.innerHTML = `
        <span class="log-entry-num">#${scanCount}</span>
        <span class="log-entry-dot"></span>
        <div class="log-entry-body">
          <div class="log-entry-code">${isError ? (errorMsg ?? 'Error') : id}</div>
          ${isDiff && !isError ? `<div class="log-entry-raw">${rawCode}</div>` : ''}
          ${isError ? `<div class="log-entry-raw">${id}</div>` : ''}
        </div>
        <span class="log-entry-time">${time}</span>
      `;

      logList.insertBefore(li, logList.firstChild);
      if (logEmpty.parentNode === logList) logList.removeChild(logEmpty);

      logBadge.textContent = scanCount;
      logBadge.className = 'log-badge has-entries';
    }

    function clearLog() {
      scanCount = 0;
      logList.innerHTML = '';
      logEmpty.style.display = '';
      logList.appendChild(logEmpty);
      logBadge.textContent = '0';
      logBadge.className = 'log-badge';
    }

    function showStatus(type, icon, message) {
      statusEl.className = `status ${type} visible`;
      statusEl.innerHTML = `${icon}<span>${message}</span>`;
    }

    function clearStatus() {
      statusEl.className = 'status';
      statusEl.innerHTML = '';
    }

    // ── Core scan handler ─────────────────────────────────────────────────
    async function handleCode(rawCode) {
      packageIcon.className = 'package-icon processing';
      showStatus('loading', ICON_SPIN, 'Procesando…');

      try {
        const id = await procesarCodigo(rawCode);
        const resolvedId = id ?? rawCode;

        packageIcon.className = 'package-icon idle';
        showStatus('success', ICON_CHECK, 'Paquete escaneado');
        lastCodeEl.textContent = resolvedId;
        lastCodeEl.className = 'last-code visible';
        addLogEntry(resolvedId, rawCode, false);

        setTimeout(clearStatus, 2000);

      } catch (err) {
        packageIcon.className = 'package-icon idle';
        const msg = err?.message ?? 'No se pudo procesar el paquete';
        showStatus('error', ICON_X, msg);
        addLogEntry(rawCode, rawCode, true, msg);

        setTimeout(clearStatus, 2800);
      }
    }

    // ── HID input: autofocus + re-arm on blur ─────────────────────────────
    function armScanner() {
      hidInput.focus({ preventScroll: true });
    }

    function setArmed(armed) {
      focusIndicator.className = armed ? 'armed' : '';
    }

    hidInput.addEventListener('focus', () => setArmed(true));
    hidInput.addEventListener('blur', () => {
      setArmed(false);
      requestAnimationFrame(armScanner);
    });

    // Clic en cualquier parte de la pantalla vuelve a enfocar
    document.getElementById('scannerScreen').addEventListener('click', armScanner);

    // El lector envía los caracteres del código + Enter
    hidInput.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      const code = hidInput.value.trim();
      hidInput.value = '';
      if (code) handleCode(code);
    });


    // ─────────────────────────────────────────────────────────────────────
    // procesarCodigo — integrar aquí la lógica de negocio.
    // Retorna el id normalizado (string) o lanza Error si falla.
    //
    // Formato JSON MeLi:
    //   {"id":"12345678","t":"lm"}                    → shipment
    //   {"id":"12345678","legacy_id":"...","t":"hu"}  → HU
    // ─────────────────────────────────────────────────────────────────────
    async function procesarCodigo(rawCode) {
      let id = rawCode;
      try {
        const parsed = JSON.parse(rawCode);
        if (parsed?.id) id = String(parsed.id);
      } catch { /* texto plano — ok */ }

      console.log('Código escaneado:', id, '| raw:', rawCode);
      return id;

      // Ejemplo con GridClient:
      // const bucket = await GridClient.getStateBucket('escaneo_rapido');
      // bucket.data.push({ id, ts: Date.now() });
      // await GridClient.putStateBucket('escaneo_rapido', bucket.data);
      // return id;
    }
  </script>

</body>
</html>
