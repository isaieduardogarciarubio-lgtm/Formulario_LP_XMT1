<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consolidado de Auditoría — Grid</title>
  <script src="/d/_libs/plotly.min.js"></script>
  <script src="/d/_libs/jszip.min.js"></script>
  <style>
    :root {
      --surface-1: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --gridline: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --series-1: #3987e5;
      --series-2: #008300;
      --series-8: #e66767;
      --status-good: #0ca30c;
      --status-critical: #d03b3b;
      --seq-blue-100: #86b6ef;
      --seq-blue-400: #3987e5;
      --seq-blue-600: #184f95;
      --color-bg: #000000;
      --color-surface: #1c1c1e;
      --color-surface-hover: #2c2c2e;
      --color-highlight: #3a3a3c;
      --color-text-primary: #ffffff;
      --color-text-muted: #8e8e93;
      --color-error: #ff453a;
      --color-border: #2c2c2e;
      --color-accent-yellow: #ffd100;
      --radius-card: 20px;
      --radius-sm: 8px;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --font-h1: 1.75rem;
      --font-h2: 1.25rem;
      --font-body: 0.95rem;
      --font-small: 0.85rem;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif;
      background: var(--color-bg);
      color: var(--color-text-primary);
      line-height: 1.5;
      min-height: 100vh;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: var(--spacing-md) var(--spacing-lg);
    }

    .navbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-lg);
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      flex: 1;
    }

    .navbar-brand h1 {
      font-size: var(--font-h1);
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }

    .navbar-brand svg {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .navbar-actions {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--color-surface-hover);
      border: 1px solid var(--color-border);
      color: var(--color-text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: var(--color-highlight);
      border-color: var(--color-accent-yellow);
    }

    .btn-icon svg {
      width: 20px;
      height: 20px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-accent-yellow), #ffa500);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      color: #000000;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .content {
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      padding: var(--spacing-lg);
    }

    .capsule {
      background: linear-gradient(135deg, rgba(40, 40, 40, 0.8), rgba(30, 30, 30, 0.6));
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
      backdrop-filter: blur(10px);
    }

    .capsule-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--spacing-lg);
      gap: var(--spacing-md);
    }

    .capsule-header h2 {
      font-size: var(--font-h2);
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }

    .capsule-header h2 svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .log-tabs {
      display: flex;
      gap: var(--spacing-sm);
      flex-wrap: wrap;
    }

    .log-tab {
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-sm);
      background: var(--color-surface-hover);
      border: 1px solid var(--color-border);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
      font-size: var(--font-body);
    }

    .log-tab:hover {
      border-color: var(--color-accent-yellow);
      color: var(--color-text-primary);
    }

    .log-tab.active {
      background: var(--color-accent-yellow);
      border-color: var(--color-accent-yellow);
      color: #000000;
    }

    /* Dropzone */
    .dropzone {
      border: 2px dashed var(--color-border);
      border-radius: var(--radius-sm);
      padding: var(--spacing-xl);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(255, 255, 255, 0.02);
    }

    .dropzone:hover,
    .dropzone.drag-over {
      border-color: var(--color-accent-yellow);
      background: rgba(255, 209, 0, 0.05);
    }

    .dropzone-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto var(--spacing-md);
      color: var(--color-text-muted);
    }

    .dropzone-text {
      font-size: var(--font-h2);
      font-weight: 700;
      margin-bottom: var(--spacing-sm);
    }

    .dropzone-hint {
      font-size: var(--font-body);
      color: var(--color-text-muted);
    }

    .upload-progress {
      margin-top: var(--spacing-lg);
      display: none;
    }

    .upload-progress.active {
      display: block;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--color-surface-hover);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: var(--spacing-md);
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--color-accent-yellow);
      width: 0%;
      transition: width 0.2s;
    }

    .progress-text {
      font-size: var(--font-small);
      color: var(--color-text-muted);
      text-align: center;
    }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--spacing-lg);
      margin-bottom: var(--spacing-xl);
    }

    .kpi-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: var(--spacing-md);
      text-align: center;
    }

    .kpi-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-accent-yellow);
      margin-bottom: var(--spacing-sm);
    }

    .kpi-label {
      font-size: var(--font-small);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Charts */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: var(--spacing-lg);
      margin-bottom: var(--spacing-xl);
    }

    .chart-container {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: var(--spacing-md);
    }

    .chart-title {
      font-size: var(--font-h2);
      font-weight: 700;
      margin-bottom: var(--spacing-md);
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }

    /* Table */
    .table-wrapper {
      overflow-x: auto;
      border-radius: var(--radius-sm);
    }

    .table-controls {
      display: flex;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
      flex-wrap: wrap;
      align-items: center;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      background: var(--color-surface-hover);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      font-size: var(--font-body);
      color: var(--color-text-primary);
    }

    .search-input::placeholder {
      color: var(--color-text-muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--font-small);
    }

    thead {
      background: transparent;
      border-bottom: 2px solid var(--color-border);
    }

    th {
      text-align: left;
      padding: var(--spacing-md);
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    td {
      padding: var(--spacing-md);
      border-bottom: 1px solid var(--color-border);
      color: var(--color-text-primary);
    }

    tr:hover {
      background: var(--color-surface-hover);
    }

    .status-good {
      color: var(--status-good);
      font-weight: 600;
    }

    .status-critical {
      color: var(--status-critical);
      font-weight: 600;
    }

    .photo-thumbnail {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      cursor: pointer;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-sm);
      font-size: var(--font-body);
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--color-accent-yellow);
      color: #000000;
    }

    .btn-primary:hover:not(:disabled) {
      opacity: 0.9;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--color-surface-hover);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border);
    }

    .btn-secondary:hover {
      background: var(--color-highlight);
      border-color: var(--color-accent-yellow);
    }

    /* Alert */
    .alert {
      position: fixed;
      bottom: var(--spacing-lg);
      right: var(--spacing-lg);
      max-width: 400px;
      padding: var(--spacing-md);
      border-radius: var(--radius-sm);
      font-size: var(--font-body);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .alert-success {
      background: rgba(12, 163, 12, 0.2);
      border: 1px solid var(--status-good);
      color: var(--status-good);
    }

    .alert-error {
      background: rgba(208, 59, 59, 0.2);
      border: 1px solid var(--status-critical);
      color: var(--status-critical);
    }

    .alert-close {
      margin-left: auto;
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 1.2rem;
    }

    /* Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: var(--spacing-lg);
      display: none;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: var(--spacing-lg);
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--spacing-lg);
    }

    .modal-header h3 {
      font-size: var(--font-h2);
      font-weight: 700;
      margin: 0;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--color-text-primary);
      cursor: pointer;
      font-size: 1.5rem;
    }

    .modal-actions {
      display: flex;
      gap: var(--spacing-md);
      margin-top: var(--spacing-lg);
      justify-content: flex-end;
    }

    .empty-state {
      text-align: center;
      padding: var(--spacing-xl);
      color: var(--color-text-muted);
    }

    .empty-state p {
      margin-bottom: var(--spacing-md);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <nav class="navbar">
      <div class="navbar-inner">
        <div class="navbar-brand">
          <h1>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3h7v7H3z"/>
              <path d="M14 3h7v7h-7z"/>
              <path d="M14 14h7v7h-7z"/>
              <path d="M3 14h7v7H3z"/>
            </svg>

              <path d="M1 20v-6h6"/>

    <div class="content">

      <div class="capsule">

  <script>
    // ==========================================================================
    // GridClient
    // ==========================================================================
    class GridClient {
      constructor(docId) {
        this.docId = docId;
        this.baseUrl = location.origin;
      }

      async getMe() {
        try {
          const res = await fetch(`${this.baseUrl}/api/v1/me`, {
            credentials: 'include',
          });
          if (!res.ok) throw new Error(`${res.status}`);
          return await res.json();
        } catch (e) {
          console.warn('Could not fetch /me:', e);
          return null;
        }
      }

      async getStateBucket(name) {
        try {
          const res = await fetch(`${this.baseUrl}/api/v1/documents/${this.docId}/states/${name}`, {
            credentials: 'include',
          });
          if (res.status === 404) return null;
          if (!res.ok) throw new Error(`${res.status}`);
          const data = await res.json();
          return data.data || null;
        } catch (e) {
          console.error(`getStateBucket ${name}:`, e);
          return null;
        }
      }

      async setStateBucket(name, data, ifUpdatedAt = null) {
        try {
          const body = { data };
          if (ifUpdatedAt) body.if_updated_at = ifUpdatedAt;

          const res = await fetch(`${this.baseUrl}/api/v1/documents/${this.docId}/states/${name}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            credentials: 'include',
          });

          if (res.status === 409) {
            console.warn('Conflict on state bucket update — retrying');
            return { conflict: true };
          }
          if (!res.ok) throw new Error(`${res.status}`);
          const result = await res.json();
          return result;
        } catch (e) {
          console.error(`setStateBucket ${name}:`, e);
          return null;
        }
      }

      async createFolder(name) {
        try {
          const res = await fetch(`${this.baseUrl}/api/v1/documents/${this.docId}/folders`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name }),
            credentials: 'include',
          });
          if (!res.ok) throw new Error(`${res.status}`);
          return await res.json();
        } catch (e) {
          console.error('createFolder:', e);
          return null;
        }
      }

      async uploadToFolder(folderId, filename, dataUrl) {
        try {
          const blob = await (await fetch(dataUrl)).blob();
          const formData = new FormData();
          formData.append('file', blob, filename);

          const res = await fetch(`${this.baseUrl}/api/v1/documents/${this.docId}/folders/${folderId}/documents`, {
            method: 'POST',
            body: formData,
            credentials: 'include',
          });
          if (!res.ok) throw new Error(`${res.status}`);
          return await res.json();
        } catch (e) {
          console.error('uploadToFolder:', e);
          return null;
        }
      }
    }

    // ==========================================================================
    // AuditDashboard
    // ==========================================================================
    class AuditDashboard {
      constructor() {
        const params = new URLSearchParams(location.search);
        this.docId = params.get('data_doc_id') || '01KXHHVWD581MQ567XEBW8HM5B';
        this.gridClient = new GridClient(this.docId);
        this.logs = {
          destino_doca: [],
          fury: [],
          contenerizado: [],
          linehaul: [],
        };
        this.currentLog = 'destino_doca';
        this.folderIds = {};
        this.init();
      }

      async init() {
        this.setupEventListeners();
        await this.loadUser();
        await this.loadAllLogs();
        this.render();
      }

      setupEventListeners() {
        const dropzone = document.getElementById('dropzone');
        dropzone.addEventListener('click', () => document.getElementById('file-input').click());
        dropzone.addEventListener('dragover', (e) => {
          e.preventDefault();
          dropzone.classList.add('drag-over');
        });
        dropzone.addEventListener('dragleave', () => {
          dropzone.classList.remove('drag-over');
        });
        dropzone.addEventListener('drop', async (e) => {
          e.preventDefault();
          dropzone.classList.remove('drag-over');
          const file = e.dataTransfer.files[0];
          if (file) await this.handleFile(file);
        });

        document.getElementById('file-input').addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (file) await this.handleFile(file);
          e.target.value = '';
        });

        document.getElementById('btn-refresh').addEventListener('click', () => this.loadAllLogs());
        document.getElementById('btn-download').addEventListener('click', () => this.downloadAll());
        document.getElementById('search-input').addEventListener('input', (e) => this.filterTable(e.target.value));
        document.getElementById('photo-modal-close').addEventListener('click', () => {
          document.getElementById('photo-modal').classList.remove('active');
        });
      }

      async loadUser() {
        const me = await this.gridClient.getMe();
        if (me && me.email) {
          const initials = me.email.split('@')[0].substring(0, 2).toUpperCase();
          document.getElementById('avatar').textContent = initials;
        }
      }

      async loadAllLogs() {
        for (const logType of Object.keys(this.logs)) {
          const bucket = `${logType}_master`;
          const data = await this.gridClient.getStateBucket(bucket);
          if (data && data.records) {
            this.logs[logType] = data.records;
          } else {
            this.logs[logType] = [];
          }
        }
        this.render();
      }

      async handleFile(file) {
        if (file.name.endsWith('.zip')) {
          await this.handleZipFile(file);
        } else if (file.name.endsWith('.csv')) {
          await this.handleCsvFile(file);
        } else {
          this.showAlert('Formato no soportado. Usa CSV o ZIP.', 'error');
        }
      }

      async handleCsvFile(file) {
        const text = await file.text();
        const lines = text.split('\n').filter(l => l.trim());
        if (lines.length < 2) {
          this.showAlert('CSV vacío', 'error');
          return;
        }

        const headers = lines[0].split(',').map(h => h.trim());
        const logType = detectLogTypeFromHeaders(headers);

        if (!logType) {
          this.showAlert('No se pudo detectar el tipo de log', 'error');
          return;
        }

        const records = [];
        for (let i = 1; i < lines.length; i++) {
          const values = lines[i].split(',').map(v => v.trim());
          const record = {};
          headers.forEach((h, idx) => {
            record[this.headerToFieldId(h)] = values[idx] || '';
          });
          record.ts = new Date().toISOString();
          records.push(record);
        }

        await this.addRecords(logType, records);
      }

      async handleZipFile(file) {
        if (!window.JSZip) {
          this.showAlert('JSZip no cargado', 'error');
          return;
        }

        const zip = new JSZip();
        const content = await zip.loadAsync(file);

        for (const [path, file] of Object.entries(content.files)) {
          if (path.endsWith('data.csv')) {
            const folderName = path.split('/')[0];
            const logType = folderName.split('_').slice(0, -1).join('_');

            if (!this.logs.hasOwnProperty(logType)) continue;

            const csvText = await file.async('string');
            const lines = csvText.split('\n').filter(l => l.trim());
            if (lines.length < 2) continue;

            const headers = lines[0].split(',').map(h => h.trim());
            const records = [];

            for (let i = 1; i < lines.length; i++) {
              const values = lines[i].split(',').map(v => v.trim());
              const record = {};
              headers.forEach((h, idx) => {
                const fieldId = this.headerToFieldId(h);
                const value = values[idx] || '';
                record[fieldId] = value;
              });
              record.ts = new Date().toISOString();
              records.push(record);
            }

            // Process photos
            const fotoFolder = content.folder(`${folderName}/fotos`);
            if (fotoFolder) {
              const photos = {};
              fotoFolder.forEach((relativePath, file) => {
                if (!file.dir) {
                  const filename = relativePath.split('/').pop();
                  photos[filename] = file;
                }
              });

              for (const record of records) {
                for (const field of FORMS_CONFIG[logType].fields) {
                  if (field.type === 'photo' && record[field.id]) {
                    const filename = record[field.id];
                    if (photos[filename]) {
                      const dataUrl = await photos[filename].async('data:image/jpeg;base64,');
                      record[field.id] = dataUrl;
                    }
                  }
                }
              }
            }

            await this.addRecords(logType, records);
          }
        }
      }

      async addRecords(logType, newRecords) {
        const bucket = `${logType}_master`;
        const existing = await this.gridClient.getStateBucket(bucket);
        const records = existing?.records || [];

        for (const record of newRecords) {
          const isDuplicate = records.some(
            r => r.ts === record.ts &&
                 r.hu === record.hu &&
                 r.shipment === record.shipment &&
                 r.destino === record.destino &&
                 r.doca === record.doca
          );
          if (!isDuplicate) {
            records.push(record);
          }
        }

        const updated_at = existing?.updated_at;
        const result = await this.gridClient.setStateBucket(bucket, { version: 1, records }, updated_at);

        if (result?.conflict) {
          setTimeout(() => this.addRecords(logType, newRecords), 500 + Math.random() * 500);
          return;
        }

        this.logs[logType] = records;
        this.showAlert(`${records.length} registros en ${logType}`, 'success');
        this.render();
      }

      render() {
        this.renderTabs();
        this.renderAnalysis();
      }

      renderTabs() {
        const container = document.getElementById('log-tabs');
        container.innerHTML = '';

        for (const [logType, records] of Object.entries(this.logs)) {
          if (records.length === 0) continue;

          const tab = document.createElement('button');
          tab.className = `log-tab ${logType === this.currentLog ? 'active' : ''}`;
          tab.textContent = this.getLogTitle(logType);
          tab.addEventListener('click', () => {
            this.currentLog = logType;
            this.render();
          });
          container.appendChild(tab);
        }
      }

      renderAnalysis() {
        const records = this.logs[this.currentLog];

        if (records.length === 0) {
          document.getElementById('no-data-message').style.display = 'block';
          document.getElementById('analysis-content').style.display = 'none';
          return;
        }

        document.getElementById('no-data-message').style.display = 'none';
        document.getElementById('analysis-content').style.display = 'block';

        this.renderKpis(records);
        this.renderCharts(records);
        this.renderTable(records);
      }

      renderKpis(records) {
        const container = document.getElementById('kpi-grid');
        container.innerHTML = '';

        const total = records.length;
        let good = 0, bad = 0;

        if (this.currentLog === 'destino_doca') {
          good = records.filter(r => r.resultado === 'Sin incidencia').length;
          bad = records.filter(r => r.resultado === 'Erroneo').length;

          this.addKpiCard(container, total.toString(), 'Total');
          this.addKpiCard(container, good.toString(), 'Sin incidencia');
          this.addKpiCard(container, bad.toString(), 'Erroneo');
        } else if (this.currentLog === 'fury') {
          const situations = new Set(records.map(r => r.situacion));
          this.addKpiCard(container, total.toString(), 'Total');
          situations.forEach(s => {
            const count = records.filter(r => r.situacion === s).length;
            this.addKpiCard(container, count.toString(), s);
          });
        } else if (this.currentLog === 'contenerizado') {
          const situations = new Set(records.map(r => r.situacion));
          this.addKpiCard(container, total.toString(), 'Total');
          situations.forEach(s => {
            const count = records.filter(r => r.situacion === s).length;
            this.addKpiCard(container, count.toString(), s);
          });
        } else if (this.currentLog === 'linehaul') {
          const areas = new Set(records.map(r => r.area));
          this.addKpiCard(container, total.toString(), 'Total');
          areas.forEach(a => {
            const count = records.filter(r => r.area === a).length;
            this.addKpiCard(container, count.toString(), a);
          });
        }
      }

      addKpiCard(container, value, label) {
        const card = document.createElement('div');
        card.className = 'kpi-card';
        card.innerHTML = `<div class="kpi-value">${value}</div><div class="kpi-label">${label}</div>`;
        container.appendChild(card);
      }

      renderCharts(records) {
        const container = document.getElementById('charts-grid');
        container.innerHTML = '';

        if (this.currentLog === 'destino_doca') {
          this.renderResultadoChart(container, records);
          this.renderDestinoChart(container, records);
          this.renderDocaChart(container, records);
        } else if (this.currentLog === 'fury') {
          this.renderSituacionChart(container, records);
          this.renderShipmentChart(container, records);
        } else if (this.currentLog === 'contenerizado') {
          this.renderSituacionChart(container, records);
          this.renderShipmentChart(container, records);
        } else if (this.currentLog === 'linehaul') {
          this.renderAreaChart(container, records);
          this.renderCanalizacionChart(container, records);
        }
      }

      renderResultadoChart(container, records) {
        const div = document.createElement('div');
        div.className = 'chart-container';
        container.appendChild(div);

        const counts = {};
        records.forEach(r => {
          counts[r.resultado] = (counts[r.resultado] || 0) + 1;
        });

        const data = [{
          labels: Object.keys(counts),
          values: Object.values(counts),
          type: 'pie',
          marker: { colors: [this.getColor('good'), this.getColor('critical')] },
        }];

        const layout = {
          title: 'Distribución de Resultados',
          plot_bgcolor: 'transparent',
          paper_bgcolor: 'transparent',
          font: { color: '#ffffff' },
          showlegend: true,
        };

        Plotly.newPlot(div, data, layout, { responsive: true, displayModeBar: false });
      }

      renderSituacionChart(container, records) {
        const div = document.createElement('div');
        div.className = 'chart-container';
        container.appendChild(div);

        const counts = {};
        records.forEach(r => {
          counts[r.situacion] = (counts[r.situacion] || 0) + 1;
        });

        const data = [{
          x: Object.keys(counts),
          y: Object.values(counts),
          type: 'bar',
          marker: { color: this.getColor('series') },
        }];

        const layout = {
          title: 'Distribución de Situaciones',
          xaxis: { title: 'Situación' },
          yaxis: { title: 'Cantidad' },
          plot_bgcolor: 'transparent',
          paper_bgcolor: 'transparent',
          font: { color: '#ffffff' },
        };

        Plotly.newPlot(div, data, layout, { responsive: true, displayModeBar: false });
      }

      renderDestinoChart(container, records) {
        const div = document.createElement('div');
        div.className = 'chart-container';
        container.appendChild(div);

        const counts = {};
        records.forEach(r => {
          counts[r.destino] = (counts[r.destino] || 0) + 1;
        });

        const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8);

        const data = [{
          x: sorted.map(([k]) => k),
          y: sorted.map(([, v]) => v),
          type: 'bar',
          marker: { color: this.getColor('series') },
        }];

        const layout = {
          title: 'Top Destinos',
          xaxis: { title: 'Destino' },
          yaxis: { title: 'Cantidad' },
          plot_bgcolor: 'transparent',
          paper_bgcolor: 'transparent',
          font: { color: '#ffffff' },
        };

        Plotly.newPlot(div, data, layout, { responsive: true, displayModeBar: false });
      }

      renderDocaChart(container, records) {
        const div = document.createElement('div');
        div.className = 'chart-container';
        container.appendChild(div);

        const counts = {};
        records.forEach(r => {
          counts[r.doca] = (counts[r.doca] || 0) + 1;
        });

        const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8);

        const data = [{
          x: sorted.map(([k]) => k),
          y: sorted.map(([, v]) => v),
          type: 'bar',
          marker: { color: this.getColor('good') },
        }];

        const layout = {
          title: 'Top Docas',
          xaxis: { title: 'Doca' },
          yaxis: { title: 'Cantidad' },
          plot_bgcolor: 'transparent',
          paper_bgcolor: 'transparent',
          font: { color: '#ffffff' },
        };

        Plotly.newPlot(div, data, layout, { responsive: true, displayModeBar: false });
      }

      renderAreaChart(container, records) {
        const div = document.createElement('div');
        div.className = 'chart-container';
        container.appendChild(div);

        const counts = {};
        records.forEach(r => {
          counts[r.area] = (counts[r.area] || 0) + 1;
        });

        const data = [{
          labels: Object.keys(counts),
          values: Object.values(counts),
          type: 'pie',
          marker: { colors: [this.getColor('series'), this.getColor('good'), this.getColor('critical')] },
        }];

        const layout = {
          title: 'Distribución por Área',
          plot_bgcolor: 'transparent',
          paper_bgcolor: 'transparent',
          font: { color: '#ffffff' },
        };

        Plotly.newPlot(div, data, layout, { responsive: true, displayModeBar: false });
      }

      renderCanalizacionChart(container, records) {
        const div = document.createElement('div');
        div.className = 'chart-container';
        container.appendChild(div);

        const counts = {};
        records.forEach(r => {
          counts[r.canalizacion] = (counts[r.canalizacion] || 0) + 1;
        });

        const data = [{
          x: Object.keys(counts),
          y: Object.values(counts),
          type: 'bar',
          marker: { color: this.getColor('series') },
        }];

        const layout = {
          title: 'Distribución de Canalizaciones',
          xaxis: { title: 'Canalización' },
          yaxis: { title: 'Cantidad' },
          plot_bgcolor: 'transparent',
          paper_bgcolor: 'transparent',
          font: { color: '#ffffff' },
        };

        Plotly.newPlot(div, data, layout, { responsive: true, displayModeBar: false });
      }

      renderShipmentChart(container, records) {
        const div = document.createElement('div');
        div.className = 'chart-container';
        container.appendChild(div);

        const counts = {};
        records.forEach(r => {
          counts[r.shipment] = (counts[r.shipment] || 0) + 1;
        });

        const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 10);

        const data = [{
          x: sorted.map(([k]) => k),
          y: sorted.map(([, v]) => v),
          type: 'bar',
          marker: { color: this.getColor('series') },
        }];

        const layout = {
          title: 'Top Shipments',
          xaxis: { title: 'Shipment' },
          yaxis: { title: 'Cantidad' },
          plot_bgcolor: 'transparent',
          paper_bgcolor: 'transparent',
          font: { color: '#ffffff' },
        };

        Plotly.newPlot(div, data, layout, { responsive: true, displayModeBar: false });
      }

      renderTable(records) {
        const thead = document.getElementById('table-head');
        const tbody = document.getElementById('table-body');
        thead.innerHTML = '';
        tbody.innerHTML = '';

        const config = FORMS_CONFIG[this.currentLog];
        if (!config) return;

        const tr = document.createElement('tr');
        config.csvColumns.forEach(col => {
          const th = document.createElement('th');
          th.textContent = col.header;
          tr.appendChild(th);
        });
        thead.appendChild(tr);

        records.forEach(record => {
          const tr = document.createElement('tr');
          config.csvColumns.forEach(col => {
            const td = document.createElement('td');
            const value = record[col.field] || '';

            if (col.field === 'resultado') {
              td.className = value === 'Sin incidencia' ? 'status-good' : 'status-critical';
              td.textContent = value;
            } else if (col.field === 'foto' && value.startsWith('data:')) {
              const img = document.createElement('img');
              img.src = value;
              img.className = 'photo-thumbnail';
              img.addEventListener('click', () => this.showPhoto(value));
              td.appendChild(img);
            } else {
              td.textContent = value;
            }

            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
      }

      filterTable(query) {
        const tbody = document.getElementById('table-body');
        const rows = tbody.querySelectorAll('tr');
        rows.forEach(row => {
          const text = row.textContent.toLowerCase();
          row.style.display = text.includes(query.toLowerCase()) ? '' : 'none';
        });
      }

      showPhoto(dataUrl) {
        const modal = document.getElementById('photo-modal');
        const img = document.getElementById('photo-modal-img');
        img.src = dataUrl;
        modal.classList.add('active');
      }

      async downloadAll() {
        const json = { logs: this.logs };
        const blob = new Blob([JSON.stringify(json, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `consolidado_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      showAlert(message, type = 'success') {
        const container = document.getElementById('alerts');
        const alert = document.createElement('div');
        alert.className = `alert alert-${type}`;
        alert.innerHTML = `
          <span>${message}</span>
          <button class="alert-close">&times;</button>
        `;
        container.appendChild(alert);
        alert.querySelector('.alert-close').addEventListener('click', () => alert.remove());
        setTimeout(() => alert.remove(), 5000);
      }

      headerToFieldId(header) {
        return header.toLowerCase()
          .replace(/[^a-z0-9]+/g, '_')
          .replace(/^_|_$/g, '')
          .replace('fecha/hora', 'ts')
          .replace('resultado', 'resultado');
      }

      getLogTitle(logType) {
        const config = FORMS_CONFIG[logType];
        return config?.title || logType;
      }

      getColor(type) {
        if (type === 'good') return '#0ca30c';
        if (type === 'critical') return '#d03b3b';
        if (type === 'series') return '#3987e5';
        return '#008300';
      }
    }

    // ==========================================================================
    // Helper Functions
    // ==========================================================================
    function detectLogTypeFromHeaders(headers) {
      const normalized = headers.map(h => h.toLowerCase().trim());

      if (normalized.includes('resultado')) {
        return 'destino_doca';
      } else if (normalized.includes('shipment') && normalized.includes('situacion') && normalized.includes('foto')) {
        return normalized.includes('valor') ? 'fury' : 'contenerizado';
      } else if (normalized.includes('hu') && normalized.includes('area') && normalized.includes('canalizacion')) {
        return 'linehaul';
      }

      return null;
    }

    const FORMS_CONFIG = {
      destino_doca: {
        title: 'Destino / Doca',
        csvColumns: [
          { field: 'ts', header: 'Fecha/Hora' },
          { field: 'hu', header: 'HU' },
          { field: 'destino', header: 'Destino' },
          { field: 'doca', header: 'Doca' },
          { field: 'resultado', header: 'Resultado' },
        ],
      },
      fury: {
        title: 'FURY',
        csvColumns: [
          { field: 'ts', header: 'Fecha/Hora' },
          { field: 'shipment', header: 'Shipment' },
          { field: 'foto', header: 'Foto' },
          { field: 'situacion', header: 'Situación' },
          { field: 'valor', header: 'Valor' },
        ],
      },
      contenerizado: {
        title: 'Contenerizado',
        csvColumns: [
          { field: 'ts', header: 'Fecha/Hora' },
          { field: 'shipment', header: 'Shipment' },
          { field: 'situacion', header: 'Situación' },
          { field: 'foto', header: 'Foto' },
        ],
      },
      linehaul: {
        title: 'Linehaul',
        csvColumns: [
          { field: 'ts', header: 'Fecha/Hora' },
          { field: 'hu', header: 'HU' },
          { field: 'area', header: 'Área' },
          { field: 'armado_sitio', header: 'Armado en Sitio' },
          { field: 'origen', header: 'Origen' },
          { field: 'canalizacion', header: 'Canalización' },
          { field: 'foto', header: 'Foto' },
          { field: 'comentarios', header: 'Comentarios' },
        ],
      },
    };

    // Initialize
    const dashboard = new AuditDashboard();
  </script>
</body>
</html>
