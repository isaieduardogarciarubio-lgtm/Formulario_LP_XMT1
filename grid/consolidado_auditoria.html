<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consolidado de Auditoría — Grid</title>
  <script src="/d/_libs/plotly.min.js"></script>
  <script src="/d/_libs/jszip.min.js"></script>
  <style>
    /* ═══════════════════════════════════════════
       NOCTURNE — Grid Design System
    ═══════════════════════════════════════════ */
    :root {
      --bg:          #090C0E;
      --surface:     #11161A;
      --surface-2:   #161D22;
      --border:      #1F2830;
      --border-soft: #161C21;
      --accent:        #FFD100;
      --accent-strong: #E6BC00;
      --accent-dim:    #6E5E00;
      --accent-glow:   rgba(255,209,0,.14);
      --on-accent:     #1A1A1A;
      --text:     #F4F6F8;
      --text-sub: #AAB4BC;
      --text-mut: #6B757D;
      --c-green:  #00D689;
      --c-blue:   #5A95FF;
      --c-orange: #FF9E45;
      --c-red:    #FF5C6C;
      --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-pill: 999px;
      --shadow: 0 18px 40px -20px rgba(0,0,0,.7);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      background-image:
        radial-gradient(1000px 640px at 100% -8%, rgba(255,209,0,.09), transparent 55%),
        radial-gradient(760px 520px at -12% 108%, rgba(255,209,0,.04), transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 32px 16px 56px;
    }

    /* ── HEADER (barra de título sticky, ancho completo) ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 40px;
      background: linear-gradient(180deg, rgba(9,12,14,.85), rgba(9,12,14,0));
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    .header-icon {
      width: 36px; height: 36px;
      background: var(--surface);
      border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .header-icon svg { display: block; }
    .header-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .header h1 { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.2; color: var(--text); letter-spacing: -.02em; }

    /* Menú principal (Cargar / Análisis) dentro de la barra de título */
    .header-menubar {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 5px;
    }
    .tab-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--text-sub); text-decoration: none;
      font-size: 14px; font-weight: 600; font-family: var(--font);
      padding: 9px 16px; border-radius: var(--r-pill);
      cursor: pointer; transition: all .16s; background: 0; border: none;
    }
    .tab-link:hover:not(.active) { color: var(--text); background: rgba(255,255,255,.04); }
    .tab-link.active { color: var(--text); background: var(--surface); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: flex-end;
    }

    /* ── TABS (log-tabs secundarios, dentro del contenido) ── */
    .tabs {
      display: flex; gap: 4px;
      background: var(--surface-2);
      border-radius: var(--r-pill);
      padding: 5px;
      border: 1px solid var(--border);
    }
    .tab {
      flex: 1; padding: 9px 8px;
      border: none; border-radius: var(--r-pill);
      background: transparent;
      font-size: 13px; font-weight: 600; color: var(--text-sub);
      cursor: pointer; transition: all .16s; text-align: center;
      font-family: var(--font);
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    }
    .tab.active   { background: var(--surface); color: var(--text); }
    .tab:hover:not(.active) { color: var(--text); background: rgba(255,255,255,.04); }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border-radius: var(--r-lg);
      padding: 24px;
      border: 1px solid var(--border);
      max-width: 100%;
      box-sizing: border-box;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 15px; font-weight: 700; color: var(--text);
      margin: 0 0 20px;
      display: flex; align-items: center; gap: 8px;
    }
    .card-title svg { color: var(--accent); flex-shrink: 0; }

    /* ── FORM ── */
    label {
      display: block; font-size: 11px; font-weight: 700;
      color: var(--text-mut); text-transform: uppercase; letter-spacing: .06em;
      margin-bottom: 6px; margin-top: 18px;
    }
    label:first-child { margin-top: 0; }

    input[type="text"], textarea {
      width: 100%; padding: 10px 14px;
      border: 1px solid var(--border); border-radius: var(--r-sm);
      font-size: 14px; font-family: var(--font); color: var(--text);
      background: var(--surface-2);
      transition: border-color .16s, box-shadow .16s; outline: none;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    input[type="text"]::placeholder, textarea::placeholder { color: var(--text-mut); }
    textarea { min-height: 72px; resize: vertical; }

    /* ── FILE DROP ZONE ── */
    .drop-zone {
      position: relative; border: 2px dashed var(--border);
      border-radius: var(--r-md); padding: 30px 16px;
      text-align: center; cursor: pointer;
      transition: border-color .16s, background .16s;
      background: var(--surface-2);
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent); background: rgba(255,209,0,.04);
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0;
      cursor: pointer; width: 100%; height: 100%;
    }
    .drop-icon    { display: flex; justify-content: center; margin-bottom: 10px; color: var(--accent); }
    .drop-label   { font-size: 14px; font-weight: 600; color: var(--accent); }
    .drop-hint    { font-size: 12px; color: var(--text-mut); margin-top: 4px; }
    .drop-filename {
      margin-top: 12px; font-size: 13px; color: var(--text);
      font-weight: 600; background: rgba(255,209,0,.1);
      border-radius: var(--r-sm); padding: 6px 12px; display: none;
      border: 1px solid var(--accent-dim);
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; border: 1px solid transparent; border-radius: var(--r-pill);
      padding: 11px 22px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all .16s; font-family: var(--font);
    }
    .btn-primary {
      background: linear-gradient(180deg, var(--accent), var(--accent-strong));
      color: var(--on-accent); width: 100%; margin-top: 20px;
      box-shadow: 0 8px 22px -12px rgba(255,209,0,.4), inset 0 1px 0 rgba(255,255,255,.3);
    }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.05); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; filter: none; }

    .btn-secondary {
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text-sub); font-size: 13px; padding: 8px 14px;
    }
    .btn-secondary:hover { border-color: var(--accent-dim); color: var(--text); }

    .btn-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .16s;
      padding: 0;
      flex-shrink: 0;
    }
    .btn-icon:hover {
      border-color: var(--accent-dim);
      color: var(--accent);
    }
    .btn-icon svg {
      width: 18px;
      height: 18px;
    }

    /* ── ALERTS ── */
    .alert {
      gap: 10px; padding: 14px 16px;
      border-radius: var(--r-md); font-size: 14px; border: 1px solid;
      margin-top: 16px; line-height: 1.5; display: none;
    }
    .alert.info    { border-color: rgba(90,149,255,.35);  background: rgba(90,149,255,.08);  color: #92b8ff; }
    .alert.success { border-color: rgba(0,214,137,.35);   background: rgba(0,214,137,.08);   color: #7FE9C2; }
    .alert.error   { border-color: rgba(255,92,108,.35);  background: rgba(255,92,108,.08);  color: #FFB3BB; }
    .alert.warning { border-color: rgba(255,209,0,.35);   background: rgba(255,209,0,.08);   color: #FFE680; }

    /* ── PROGRESS ── */
    .upload-progress {
      margin-top: var(--spacing-lg);
      display: none;
    }
    .upload-progress.active {
      display: block;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--surface-2);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      width: 0%;
      transition: width .2s;
    }
    .progress-text {
      font-size: 12px;
      color: var(--text-mut);
      text-align: center;
    }

    /* ── ANALYSIS PANELS ── */
    .panel { display: none; }
    .panel.active { display: block; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 16px;
      text-align: center;
    }
    .kpi-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .kpi-label {
      font-size: 11px;
      color: var(--text-mut);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .chart-container {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 16px;
      height: clamp(240px, 34vh, 400px);
      box-sizing: border-box;
      overflow: hidden;
    }
    .chart-container .js-plotly-plot,
    .chart-container .plot-container {
      width: 100%;
      height: 100%;
    }

    /* ── TABLE ── */
    .table-wrapper {
      overflow-x: auto;
      margin-top: 16px;
    }
    .table-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-input {
      flex: 1;
      min-width: 200px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text);
      font-family: var(--font);
    }
    .search-input::placeholder {
      color: var(--text-mut);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead {
      background: transparent;
      border-bottom: 1px solid var(--border);
    }
    th {
      text-align: left;
      padding: 12px;
      color: var(--text-mut);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    td {
      padding: 12px;
      border-bottom: 1px solid var(--border-soft);
      color: var(--text);
    }
    tr:hover {
      background: rgba(255, 255, 255, .02);
    }
    .photo-thumbnail {
      width: 36px;
      height: 36px;
      border-radius: var(--r-sm);
      object-fit: cover;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .status-good {
      color: var(--c-green);
      font-weight: 600;
    }
    .status-critical {
      color: var(--c-red);
      font-weight: 600;
    }

    /* ── ACCIONES EN TABLA ── */
    .btn-action {
      background: transparent;
      border: none;
      font-size: 16px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--r-sm);
      transition: background .15s;
      color: var(--text-sub);
    }
    .btn-action:hover {
      background: rgba(255, 209, 0, .12);
      color: var(--accent);
    }
    .btn-delete:hover {
      background: rgba(255, 92, 108, .12);
      color: var(--c-red);
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-mut);
      font-size: 14px;
    }

    /* ── PHOTO MODAL ── */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, .8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 16px;
      display: none;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 24px;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: var(--shadow);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-header h3 {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 24px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .16s;
    }
    .modal-close:hover {
      color: var(--accent);
    }

    /* ── UTIL ── */
    .divider { height: 1px; background: var(--border-soft); margin: 20px 0; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.15); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    @media (max-width: 640px) {
      .wrap { width: 100%; padding: 24px 16px 48px; }
      .header { padding: 16px 20px; flex-direction: column; gap: 16px; }
      .header-menubar { order: 2; width: 100%; }
      .header-menubar .tab-link { flex: 1; justify-content: center; }
      .header-right { order: 3; width: 100%; justify-content: center; }
      .tabs { border-radius: var(--r-lg); }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .charts-grid { grid-template-columns: 1fr; }
      .chart-container { height: clamp(220px, 46vh, 420px); }
    }
  </style>
</head>

<body>

<!-- HEADER (barra de título) -->
<header class="header">
  <div class="brand">
    <div class="header-icon">
      <img id="header-logo" alt="Logo" />
    </div>
    <h1>Consolidado de Auditoría</h1>
  </div>

  <div class="header-menubar" id="main-tabs">
    <button class="tab-link active" data-tab="upload" id="main-tab-upload">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
      Cargar
    </button>
    <button class="tab-link" data-tab="analysis" id="main-tab-analysis">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Análisis
    </button>
  </div>

  <div class="header-right">
    <button class="btn-icon" id="btn-refresh" title="Actualizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 4v6h-6"/>
        <path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
      </svg>
    </button>
    <button class="btn-icon" id="btn-download" title="Descargar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
  </div>
</header>

<div class="wrap">

  <!-- TABS de log (solo visibles dentro de Análisis) -->
  <div class="tabs" id="log-tabs" style="display: none;"></div>

  <!-- PANEL: CARGAR ──────────────────────────────── -->
  <div id="panel-upload" class="panel active">
    <div class="card">
      <p class="card-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
        Cargar Registros
      </p>

      <label>Archivo CSV o ZIP</label>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".csv,.zip">
        <div class="drop-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        </div>
        <div class="drop-label">Arrastra un archivo aquí</div>
        <div class="drop-hint">CSV o ZIP · Máx 500 MB</div>
        <div class="drop-filename" id="dropFilename"></div>
      </div>

      <div class="upload-progress" id="upload-progress">
        <div class="progress-bar">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">Subiendo fotos: 0/0</div>
      </div>

      <div class="alert" id="uploadAlert"></div>
    </div>
  </div>

  <!-- PANEL: ANÁLISIS ──────────────────────────────── -->
  <div id="panel-analysis" class="panel">
    <div class="card">
      <p class="card-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Análisis
      </p>

      <div id="no-data-message" class="empty-state">
        <p>No hay registros. Carga un archivo CSV o ZIP para comenzar.</p>
      </div>

      <div id="analysis-content" style="display: none;">
        <!-- KPIs -->
        <div class="kpi-grid" id="kpi-grid"></div>

        <!-- Charts -->
        <div class="charts-grid" id="charts-grid"></div>

        <!-- Table -->
        <div class="table-wrapper">
          <div class="table-controls">
            <input type="text" class="search-input" id="search-input" placeholder="Buscar en registros…" />
          </div>
          <table id="records-table">
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</div><!-- /wrap -->

<!-- Photo Modal -->
<div class="modal" id="photo-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Foto</h3>
      <button class="modal-close" id="photo-modal-close">&times;</button>
    </div>
    <img id="photo-modal-img" style="width: 100%; border-radius: 8px;" />
  </div>
</div>

<script>
  // ==========================================================================
  // GridClient
  //
  // IMPORTANTE (Biblia Grid V11.4, sección 23): el bucket nombrado
  // (/api/v1/documents/{id}/states/{name}) es el único con control optimista
  // real (409 en escrituras concurrentes desactualizadas). El payload va bajo
  // la clave "state" (no "data"), y la respuesta trae "state" + "updated_at"
  // en el nivel superior: { state: {...}, updated_at: "iso-timestamp" }.
  //
  // NO usar window.GRID.state/states para persistencia durable: la Biblia
  // documenta explícitamente que ese objeto está atado al docId del propio
  // contenedor HTML, y "el docId cambia en cada upload" — cada vez que se
  // sube una nueva versión del dashboard, los datos guardados bajo el docId
  // anterior quedan inalcanzables. Por eso usamos siempre fetch directo
  // contra un doc_id estable y explícito (this.docId), nunca window.GRID.
  // ==========================================================================
  class GridClient {
    constructor(docId) {
      this.docId = docId;
      this.baseUrl = location.origin;
      this._updatedAtByName = {};
    }

    async getMe() {
      try {
        const res = await fetch(`${this.baseUrl}/api/v1/me`, { credentials: 'include' });
        if (!res.ok) throw new Error(`${res.status}`);
        return await res.json();
      } catch (e) {
        console.warn('Could not fetch /me:', e);
        return null;
      }
    }

    /**
     * GET /documents/{id}/download no sirve el binario directo: devuelve
     * metadata JSON con download_url (o agent_download_url), que hay que
     * volver a fetchear para obtener el blob real.
     */
    async downloadDocumentAsObjectUrl(docId) {
      try {
        const metaRes = await fetch(`${this.baseUrl}/api/v1/documents/${docId}/download`, {
          credentials: 'include',
        });
        if (!metaRes.ok) throw new Error(`${metaRes.status}`);
        const meta = await metaRes.json();
        const url = meta.download_url || meta.agent_download_url;
        if (!url) throw new Error('No se encontró download_url en la respuesta');

        const blobRes = await fetch(url, { credentials: 'include' });
        if (!blobRes.ok) throw new Error(`${blobRes.status}`);
        const blob = await blobRes.blob();
        return URL.createObjectURL(blob);
      } catch (e) {
        console.warn(`downloadDocumentAsObjectUrl ${docId}:`, e);
        return null;
      }
    }

    async getStateBucket(name) {
      try {
        const res = await fetch(`${this.baseUrl}/api/v1/documents/${this.docId}/states/${name}`, {
          credentials: 'include',
        });
        if (res.status === 404) return null;
        if (!res.ok) throw new Error(`${res.status}`);
        const body = await res.json();
        this._updatedAtByName[name] = body.updated_at || '';
        return body.state ?? null;
      } catch (e) {
        console.error(`getStateBucket ${name}:`, e);
        return null;
      }
    }

    async setStateBucket(name, data) {
      try {
        const ifUpdatedAt = this._updatedAtByName[name] || '';
        const res = await fetch(`${this.baseUrl}/api/v1/documents/${this.docId}/states/${name}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ state: data, if_updated_at: ifUpdatedAt }),
          credentials: 'include',
        });

        if (res.status === 409) {
          const conflictBody = await res.json().catch(() => ({}));
          if (conflictBody.current_updated_at) {
            this._updatedAtByName[name] = conflictBody.current_updated_at;
          }
          console.warn('Conflict on state bucket update — retrying');
          return { conflict: true };
        }
        if (!res.ok) throw new Error(`${res.status}`);
        const body = await res.json();
        this._updatedAtByName[name] = body.updated_at || '';
        return { ok: true };
      } catch (e) {
        console.error(`setStateBucket ${name}:`, e);
        return null;
      }
    }
  }

  // ==========================================================================
  // AuditDashboard
  // ==========================================================================
  class AuditDashboard {
    constructor() {
      const params = new URLSearchParams(location.search);
      this.docId = params.get('data_doc_id') || '01KXHHVWD581MQ567XEBW8HM5B';
      this.gridClient = new GridClient(this.docId);
      this.logs = {
        destino_doca: [],
        fury: [],
        contenerizado: [],
        linehaul: [],
      };
      this.currentLog = 'destino_doca';
      this.activeMainTab = 'upload';
      this.init();
    }

    async init() {
      this.setupEventListeners();
      this.loadHeaderLogo();
      await this.loadAllLogs();
      const hasExistingData = Object.values(this.logs).some(r => r.length > 0);
      if (hasExistingData) {
        this.currentLog = Object.entries(this.logs).find(([, r]) => r.length > 0)[0];
        this.switchMainTab('analysis');
      }
    }

    async loadHeaderLogo() {
      const logoDocId = '01KTD4Q8GC7Y620F9F9WEXGDE4';
      const objectUrl = await this.gridClient.downloadDocumentAsObjectUrl(logoDocId);
      if (objectUrl) {
        document.getElementById('header-logo').src = objectUrl;
      }
    }

    setupEventListeners() {
      const dropzone = document.getElementById('dropZone');
      dropzone.addEventListener('click', () => document.getElementById('fileInput').click());
      dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });
      dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('dragover');
      });
      dropzone.addEventListener('drop', async (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) await this.handleFile(file);
      });

      document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) await this.handleFile(file);
        e.target.value = '';
      });

      document.getElementById('btn-refresh').addEventListener('click', () => this.loadAllLogs());
      document.getElementById('btn-download').addEventListener('click', () => this.downloadAll());
      document.getElementById('search-input').addEventListener('input', (e) => this.filterTable(e.target.value));
      document.getElementById('photo-modal-close').addEventListener('click', () => {
        document.getElementById('photo-modal').classList.remove('active');
      });

      document.getElementById('main-tab-upload').addEventListener('click', () => this.switchMainTab('upload'));
      document.getElementById('main-tab-analysis').addEventListener('click', () => this.switchMainTab('analysis'));
    }

    switchMainTab(tabName) {
      this.activeMainTab = tabName;
      document.getElementById('panel-upload').classList.toggle('active', tabName === 'upload');
      document.getElementById('panel-analysis').classList.toggle('active', tabName === 'analysis');
      document.getElementById('main-tab-upload').classList.toggle('active', tabName === 'upload');
      document.getElementById('main-tab-analysis').classList.toggle('active', tabName === 'analysis');
      // render() vuelve a dibujar las gráficas (ver renderAnalysis): Plotly
      // calcula dimensiones en el momento de dibujar, así que si el panel
      // estaba oculto (display:none) antes, el gráfico queda mal dimensionado
      // y no se autocorrige solo al mostrarse — hay que redibujar con el
      // panel ya visible.
      this.render();
    }

    async loadAllLogs() {
      for (const logType of Object.keys(this.logs)) {
        const bucket = `${logType}_master`;
        const data = await this.gridClient.getStateBucket(bucket);
        if (data && data.records) {
          this.logs[logType] = data.records;
        } else {
          this.logs[logType] = [];
        }
      }
      this.render();
    }

    async handleFile(file) {
      if (file.name.endsWith('.zip')) {
        await this.handleZipFile(file);
      } else if (file.name.endsWith('.csv')) {
        await this.handleCsvFile(file);
      } else {
        this.showAlert('uploadAlert', 'error', 'Formato no soportado. Usa CSV o ZIP.');
      }
    }

    async handleCsvFile(file) {
      const text = await file.text();
      const { headers, records: rawRecords } = parseCSV(text);

      if (rawRecords.length === 0) {
        this.showAlert('uploadAlert', 'error', 'CSV vacío');
        return;
      }

      const logType = detectLogTypeFromHeaders(headers);

      if (!logType) {
        this.showAlert('uploadAlert', 'error', 'No se pudo detectar el tipo de log');
        return;
      }

      const auditoriaId = file.name.replace(/\.csv$/i, '');
      const records = rawRecords.map(raw => {
        const record = mapRowToRecord(raw, logType);
        record.auditoria = auditoriaId;
        return record;
      });
      await this.addRecords(logType, records);
    }

    async handleZipFile(file) {
      if (!window.JSZip) {
        this.showAlert('uploadAlert', 'error', 'JSZip no cargado');
        return;
      }

      const zip = new JSZip();
      const content = await zip.loadAsync(file);

      for (const [path, file] of Object.entries(content.files)) {
        if (path.endsWith('data.csv')) {
          const folderName = path.split('/')[0];
          const logType = folderName.split('_').slice(0, -1).join('_');

          if (!this.logs.hasOwnProperty(logType)) continue;

          const csvText = await file.async('string');
          const { headers, records: rawRecords } = parseCSV(csvText);
          if (rawRecords.length === 0) continue;

          const records = rawRecords.map(raw => {
            const record = mapRowToRecord(raw, logType);
            record.auditoria = folderName;
            return record;
          });

          // Process photos
          const fotoFolder = content.folder(`${folderName}/fotos`);
          if (fotoFolder) {
            const photos = {};
            fotoFolder.forEach((relativePath, file) => {
              if (!file.dir) {
                const filename = relativePath.split('/').pop();
                photos[filename] = file;
              }
            });

            for (const record of records) {
              for (const field of FORMS_CONFIG[logType].fields) {
                if (field.type === 'photo' && record[field.id]) {
                  const filename = record[field.id];
                  if (photos[filename]) {
                    const dataUrl = await photos[filename].async('data:image/jpeg;base64,');
                    record[field.id] = dataUrl;
                  }
                }
              }
            }
          }

          await this.addRecords(logType, records);
        }
      }
    }

    async addRecords(logType, newRecords) {
      const bucket = `${logType}_master`;
      const existing = await this.gridClient.getStateBucket(bucket);
      const records = existing?.records ? [...existing.records] : [];

      for (const record of newRecords) {
        const isDuplicate = records.some(
          r => r.ts === record.ts &&
               r.hu === record.hu &&
               r.shipment === record.shipment &&
               r.destino === record.destino &&
               r.doca === record.doca
        );
        if (!isDuplicate) {
          records.push(record);
        }
      }

      const result = await this.gridClient.setStateBucket(bucket, { version: 1, records });

      if (result?.conflict) {
        setTimeout(() => this.addRecords(logType, newRecords), 500 + Math.random() * 500);
        return;
      }

      if (!result) {
        this.showAlert('uploadAlert', 'error', `No se pudo guardar en ${logType} (ver consola)`);
        return;
      }

      this.logs[logType] = records;
      this.currentLog = logType;
      this.showAlert('uploadAlert', 'success', `${records.length} registros en ${logType}`);
      this.switchMainTab('analysis');
    }

    render() {
      this.renderTabs();
      this.renderAnalysis();
    }

    renderTabs() {
      const container = document.getElementById('log-tabs');
      const hasAny = Object.values(this.logs).some(r => r.length > 0);

      if (!hasAny || this.activeMainTab !== 'analysis') {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'flex';
      container.innerHTML = '';

      for (const [logType, records] of Object.entries(this.logs)) {
        if (records.length === 0) continue;

        const tab = document.createElement('button');
        tab.className = `tab ${logType === this.currentLog ? 'active' : ''}`;
        tab.textContent = this.getLogTitle(logType);
        tab.addEventListener('click', () => {
          this.currentLog = logType;
          this.render();
        });
        container.appendChild(tab);
      }
    }

    renderAnalysis() {
      const records = this.logs[this.currentLog];

      if (records.length === 0) {
        document.getElementById('no-data-message').style.display = 'block';
        document.getElementById('analysis-content').style.display = 'none';
        return;
      }

      document.getElementById('no-data-message').style.display = 'none';
      document.getElementById('analysis-content').style.display = 'block';

      this.renderKpis(records);
      this.renderTable(records);

      // Las gráficas solo se dibujan cuando el panel realmente está visible
      // (ver switchMainTab) para que Plotly calcule dimensiones correctas.
      if (this.activeMainTab === 'analysis') {
        this.renderCharts(records);
      }
    }

    renderKpis(records) {
      const container = document.getElementById('kpi-grid');
      container.innerHTML = '';

      const total = records.length;
      let good = 0, bad = 0;

      if (this.currentLog === 'destino_doca') {
        good = records.filter(r => r.resultado === 'Sin incidencia').length;
        bad = records.filter(r => r.resultado === 'Erroneo').length;

        this.addKpiCard(container, total.toString(), 'Total');
        this.addKpiCard(container, good.toString(), 'Sin incidencia');
        this.addKpiCard(container, bad.toString(), 'Erroneo');
      } else if (this.currentLog === 'fury') {
        const situations = new Set(records.map(r => r.situacion));
        this.addKpiCard(container, total.toString(), 'Total');
        situations.forEach(s => {
          const count = records.filter(r => r.situacion === s).length;
          this.addKpiCard(container, count.toString(), s);
        });
      } else if (this.currentLog === 'contenerizado') {
        const situations = new Set(records.map(r => r.situacion));
        this.addKpiCard(container, total.toString(), 'Total');
        situations.forEach(s => {
          const count = records.filter(r => r.situacion === s).length;
          this.addKpiCard(container, count.toString(), s);
        });
      } else if (this.currentLog === 'linehaul') {
        const areas = new Set(records.map(r => r.area));
        this.addKpiCard(container, total.toString(), 'Total');
        areas.forEach(a => {
          const count = records.filter(r => r.area === a).length;
          this.addKpiCard(container, count.toString(), a);
        });
      }
    }

    addKpiCard(container, value, label) {
      const card = document.createElement('div');
      card.className = 'kpi-card';
      card.innerHTML = `<div class="kpi-value">${value}</div><div class="kpi-label">${label}</div>`;
      container.appendChild(card);
    }

    countByField(records, field) {
      const counts = {};
      records.forEach(r => {
        const key = (r[field] || '').toString().trim() || '(sin dato)';
        counts[key] = (counts[key] || 0) + 1;
      });
      return counts;
    }

    renderCharts(records) {
      const container = document.getElementById('charts-grid');

      if (typeof Plotly === 'undefined') {
        if (this._chartsRafId) cancelAnimationFrame(this._chartsRafId);
        container.innerHTML = '';
        const warn = document.createElement('div');
        warn.className = 'empty-state';
        warn.textContent = 'Plotly no está disponible en este entorno.';
        container.appendChild(warn);
        return;
      }

      // render() puede dispararse más de una vez seguida (p. ej. el usuario
      // hace clic en "Análisis" mientras la carga inicial todavía está en
      // curso). Si cada llamada limpiara el contenedor de forma síncrona
      // pero dibujara con Plotly de forma diferida (rAF), varios dibujos
      // pendientes terminarían ejecutándose en el mismo frame sobre el
      // contenedor ya vacío, apilando gráficas duplicadas. Por eso
      // cancelamos cualquier dibujo pendiente y limpiamos justo antes de
      // dibujar, dentro del mismo callback — solo el último render gana.
      if (this._chartsRafId) {
        cancelAnimationFrame(this._chartsRafId);
      }

      // El panel puede acabar de volverse visible (cambio de pestaña) o el
      // grid CSS (auto-fit) puede no haber terminado de calcular el ancho
      // final de columna todavía. Si Plotly dibuja en ese instante, mide un
      // ancho incorrecto y el gráfico queda descuadrado/recortado sin
      // autocorregirse después. Esperar un frame garantiza que el layout ya
      // esté asentado antes de que Plotly lea las dimensiones reales.
      this._chartsRafId = requestAnimationFrame(() => {
        this._chartsRafId = null;
        container.innerHTML = '';

        let builders = [];
        if (this.currentLog === 'destino_doca') {
          builders = [
            () => this.buildResultadoChart(records),
            () => this.buildDestinoChart(records),
          ];
        } else if (this.currentLog === 'fury' || this.currentLog === 'contenerizado') {
          builders = [() => this.buildSituacionChart(records)];
        } else if (this.currentLog === 'linehaul') {
          builders = [() => this.buildAreaChart(records)];
        }

        // Fase 1: crear y anexar TODOS los divs primero. Con CSS Grid
        // (auto-fit), el número de columnas depende de cuántos items hay
        // en el momento de medir: si se dibuja el primer gráfico antes de
        // que exista el segundo div, el grid colapsa a 1 sola columna a
        // ancho completo, Plotly mide ese ancho incorrecto, y cuando el
        // grid se reacomoda a 2 columnas al llegar el segundo div, el SVG
        // ya dibujado no se vuelve a medir solo — queda descuadrado y
        // recortado por el overflow:hidden del contenedor.
        const specs = builders.map(build => {
          const div = document.createElement('div');
          div.className = 'chart-container';
          container.appendChild(div);
          return { div, ...build() };
        });

        // Fase 2: con el grid ya en su layout final, dibujar cada gráfica.
        specs.forEach(({ div, data, layout }) => {
          Plotly.newPlot(div, data, layout, { responsive: true, displayModeBar: false });
        });
      });
    }

    buildResultadoChart(records) {
      const counts = this.countByField(records, 'resultado');

      const data = [{
        labels: Object.keys(counts),
        values: Object.values(counts),
        type: 'pie',
        marker: { colors: ['#FFD100', '#E6BC00'] },
      }];

      const layout = {
        title: 'Distribución de Resultados',
        plot_bgcolor: 'transparent',
        paper_bgcolor: 'transparent',
        font: { color: '#F4F6F8', size: 11 },
        showlegend: true,
        legend: { orientation: 'h', x: 0.5, xanchor: 'center', y: -0.15 },
        margin: { l: 20, r: 20, t: 40, b: 20 },
      };

      return { data, layout };
    }

    buildSituacionChart(records) {
      const counts = this.countByField(records, 'situacion');

      const data = [{
        x: Object.keys(counts),
        y: Object.values(counts),
        type: 'bar',
        marker: { color: '#FFD100' },
      }];

      const layout = {
        title: 'Distribución de Situaciones',
        xaxis: { title: 'Situación' },
        yaxis: { title: 'Cantidad' },
        plot_bgcolor: 'transparent',
        paper_bgcolor: 'transparent',
        font: { color: '#F4F6F8', size: 11 },
        margin: { l: 50, r: 30, t: 40, b: 40 },
      };

      return { data, layout };
    }

    buildDestinoChart(records) {
      const counts = this.countByField(records, 'destino');

      const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8);

      const data = [{
        x: sorted.map(([k]) => k),
        y: sorted.map(([, v]) => v),
        type: 'bar',
        marker: { color: '#FFD100' },
      }];

      const layout = {
        title: 'Top Destinos',
        xaxis: { title: 'Destino' },
        yaxis: { title: 'Cantidad' },
        plot_bgcolor: 'transparent',
        paper_bgcolor: 'transparent',
        font: { color: '#F4F6F8', size: 11 },
        margin: { l: 50, r: 30, t: 40, b: 40 },
      };

      return { data, layout };
    }

    buildAreaChart(records) {
      const counts = this.countByField(records, 'area');

      const data = [{
        labels: Object.keys(counts),
        values: Object.values(counts),
        type: 'pie',
        marker: { colors: ['#FFD100', '#E6BC00', '#FFF000'] },
      }];

      const layout = {
        title: 'Distribución por Área',
        plot_bgcolor: 'transparent',
        paper_bgcolor: 'transparent',
        font: { color: '#F4F6F8', size: 11 },
        showlegend: true,
        legend: { orientation: 'h', x: 0.5, xanchor: 'center', y: -0.15 },
        margin: { l: 20, r: 20, t: 40, b: 20 },
      };

      return { data, layout };
    }

    renderTable(records) {
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');
      thead.innerHTML = '';
      tbody.innerHTML = '';

      const config = FORMS_CONFIG[this.currentLog];
      if (!config) return;

      const tr = document.createElement('tr');
      config.csvColumns.forEach(col => {
        const th = document.createElement('th');
        th.textContent = col.header;
        tr.appendChild(th);
      });
      const thActions = document.createElement('th');
      thActions.textContent = 'Acciones';
      thActions.style.width = '120px';
      tr.appendChild(thActions);
      thead.appendChild(tr);

      records.forEach((record, index) => {
        const tr = document.createElement('tr');
        tr.setAttribute('data-index', index);

        config.csvColumns.forEach(col => {
          const td = document.createElement('td');
          const value = record[col.field] || '';

          if (col.field === 'resultado') {
            td.className = value === 'Sin incidencia' ? 'status-good' : 'status-critical';
            td.textContent = value;
          } else if (col.field === 'foto' && value.startsWith('data:')) {
            const img = document.createElement('img');
            img.src = value;
            img.className = 'photo-thumbnail';
            img.addEventListener('click', () => this.showPhoto(value));
            td.appendChild(img);
          } else {
            td.textContent = value;
          }

          tr.appendChild(td);
        });

        // Columna de acciones
        const tdActions = document.createElement('td');
        tdActions.style.display = 'flex';
        tdActions.style.gap = '6px';

        const btnDelete = document.createElement('button');
        btnDelete.className = 'btn-action btn-delete';
        btnDelete.title = 'Borrar registro';
        btnDelete.innerHTML = '🗑';
        btnDelete.addEventListener('click', () => this.deleteRecord(this.currentLog, index));

        const btnEdit = document.createElement('button');
        btnEdit.className = 'btn-action btn-edit';
        btnEdit.title = 'Editar registro';
        btnEdit.innerHTML = '✏️';
        btnEdit.addEventListener('click', () => this.editRecord(this.currentLog, index, record));

        tdActions.appendChild(btnEdit);
        tdActions.appendChild(btnDelete);
        tr.appendChild(tdActions);

        tbody.appendChild(tr);
      });
    }

    async deleteRecord(logType, index) {
      if (!confirm('¿Estás seguro de que quieres borrar este registro? Se eliminará tanto de la tabla como del consolidado.')) {
        return;
      }

      const records = this.logs[logType];
      if (index < 0 || index >= records.length) {
        alert('Registro no encontrado');
        return;
      }

      // Borrar del array local
      records.splice(index, 1);

      // Actualizar el bucket en Grid
      try {
        await this.gridClient.setStateBucket(`${logType}_master`, { version: 1, records });
        this.showNotification('✅ Registro borrado exitosamente', 'success');
      } catch (error) {
        this.logs[logType].splice(index, 0, records[index]); // Restaurar si falla
        this.showNotification('❌ Error al borrar: ' + error.message, 'error');
        return;
      }

      // Recargar tabla y gráficas
      this.render();
    }

    async editRecord(logType, index, record) {
      const config = FORMS_CONFIG[logType];
      const fields = config.csvColumns;

      // Crear un modal simple para editar
      const html = `
        <div id="edit-modal-bg" style="
          position: fixed; inset: 0; background: rgba(0,0,0,.75);
          display: flex; align-items: center; justify-content: center; z-index: 100;
          padding: 16px; backdrop-filter: blur(4px);
        ">
          <div style="
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--r-lg); padding: 24px; max-width: 500px;
            width: 100%; max-height: 80vh; overflow-y: auto;
            box-shadow: 0 18px 40px -20px rgba(0,0,0,.7);
          ">
            <h3 style="margin: 0 0 16px; font-size: 18px; font-weight: 700;">Editar Registro</h3>
            <div id="edit-form" style="display: flex; flex-direction: column; gap: 12px;"></div>
            <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end;">
              <button class="btn btn-secondary" onclick="document.getElementById('edit-modal-bg').remove()">Cancelar</button>
              <button class="btn btn-primary" id="btn-save-edit">Guardar</button>
            </div>
          </div>
        </div>
      `;

      document.body.insertAdjacentHTML('beforeend', html);

      // Llenar el formulario con los valores actuales
      const form = document.getElementById('edit-form');
      const inputs = {};

      fields.forEach(field => {
        const value = record[field.field] || '';
        const input = document.createElement('input');
        input.type = field.field === 'foto' ? 'hidden' : 'text';
        input.placeholder = field.header;
        input.value = value;
        input.style.cssText = `
          width: 100%; padding: 8px 12px; border: 1px solid var(--border);
          background: var(--surface-2); color: var(--text); border-radius: var(--r-sm);
          font-family: inherit; font-size: 13px;
        `;
        form.appendChild(input);
        inputs[field.field] = input;
      });

      // Botón guardar
      document.getElementById('btn-save-edit').addEventListener('click', async () => {
        const updated = { ...record };
        fields.forEach(field => {
          if (field.field !== 'foto') { // No editar fotos por ahora
            updated[field.field] = inputs[field.field].value;
          }
        });

        try {
          this.logs[logType][index] = updated;
          await this.gridClient.setStateBucket(`${logType}_master`, {
            version: 1,
            records: this.logs[logType]
          });
          document.getElementById('edit-modal-bg').remove();
          this.showNotification('✅ Registro actualizado', 'success');
          this.render();
        } catch (error) {
          this.showNotification('❌ Error: ' + error.message, 'error');
        }
      });
    }

    filterTable(query) {
      const tbody = document.getElementById('table-body');
      const rows = tbody.querySelectorAll('tr');
      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(query.toLowerCase()) ? '' : 'none';
      });
    }

    showPhoto(dataUrl) {
      const modal = document.getElementById('photo-modal');
      const img = document.getElementById('photo-modal-img');
      img.src = dataUrl;
      modal.classList.add('active');
    }

    async downloadAll() {
      // Consolidar todos los registros con su tipo
      const allRecords = [];

      for (const [logType, records] of Object.entries(this.logs)) {
        records.forEach(rec => {
          allRecords.push({
            'Tipo de Log': FORMS_CONFIG[logType].title,
            ...rec
          });
        });
      }

      if (allRecords.length === 0) {
        alert('No hay registros para descargar');
        return;
      }

      // Obtener todos los campos únicos
      const allFields = new Set();
      allRecords.forEach(rec => Object.keys(rec).forEach(k => allFields.add(k)));

      // Crear encabezados en orden: Tipo de Log, luego los demás
      const headers = ['Tipo de Log', ...Array.from(allFields).filter(f => f !== 'Tipo de Log')];

      // Generar CSV manualmente (similar a CSVEngine pero con más flexibilidad)
      const escapeCsv = (val) => {
        if (val === null || val === undefined) return '';
        const str = String(val);
        if (str.includes(',') || str.includes('"') || str.includes('\n')) {
          return '"' + str.replace(/"/g, '""') + '"';
        }
        return str;
      };

      const csvLines = [headers.map(escapeCsv).join(',')];
      allRecords.forEach(rec => {
        const row = headers.map(h => escapeCsv(rec[h] || '')).join(',');
        csvLines.push(row);
      });

      const csv = '﻿' + csvLines.join('\n'); // BOM UTF-8
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `consolidado_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    showAlert(id, type = 'success', message) {
      const el = document.getElementById(id);
      el.className = `alert ${type}`;
      el.textContent = message;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    }

    getLogTitle(logType) {
      const config = FORMS_CONFIG[logType];
      return config?.title || logType;
    }
  }

  // ==========================================================================
  // Config & Helpers
  // ==========================================================================

  /** Minúsculas + sin acentos, para comparar headers sin depender de tildes. */
  function normalizeText(s) {
    return String(s || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .trim();
  }

  /**
   * Parser CSV con soporte de comillas (RFC4180): respeta comas y saltos de
   * línea dentro de campos entre comillas (p. ej. el timestamp
   * "14/7/2026, 10:30:45" que genera la app de captura). Ignora BOM UTF-8.
   * Retorna { headers, records } con records como objetos { header: valor }.
   */
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);

    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = false;
          }
        } else {
          field += c;
        }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(field);
        field = '';
      } else if (c === '\n') {
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
      } else if (c === '\r') {
        // ignorar, el \n siguiente cierra la fila
      } else {
        field += c;
      }
    }
    if (field.length || row.length) {
      row.push(field);
      rows.push(row);
    }

    const nonEmpty = rows.filter(r => r.some(cell => String(cell).trim().length));
    if (!nonEmpty.length) return { headers: [], records: [] };

    const headers = nonEmpty[0].map(h => String(h).trim());
    const records = nonEmpty.slice(1).map(r => {
      const obj = {};
      headers.forEach((h, idx) => {
        obj[h] = String(r[idx] != null ? r[idx] : '').trim();
      });
      return obj;
    });

    return { headers, records };
  }

  function detectLogTypeFromHeaders(headers) {
    const normalized = headers.map(normalizeText);

    if (normalized.includes('resultado')) {
      return 'destino_doca';
    } else if (normalized.includes('shipment') && normalized.includes('situacion') && normalized.includes('foto')) {
      return normalized.includes('valor') ? 'fury' : 'contenerizado';
    } else if (normalized.includes('hu') && normalized.includes('area') && normalized.includes('canalizacion')) {
      return 'linehaul';
    }

    return null;
  }

  /** Header (texto exacto del CSV, con acentos) → field id, por tipo de log. */
  function buildHeaderFieldMap(logType) {
    const config = FORMS_CONFIG[logType];
    const map = {};
    config.csvColumns.forEach(col => {
      map[normalizeText(col.header)] = col.field;
    });
    return map;
  }

  /** Convierte un registro { "Fecha/Hora": "...", "HU": "..." } a { ts, hu, ... }. */
  function mapRowToRecord(rawRow, logType) {
    const map = buildHeaderFieldMap(logType);
    const record = {};
    for (const [header, value] of Object.entries(rawRow)) {
      const field = map[normalizeText(header)];
      if (field) record[field] = value;
    }
    if (!record.ts) record.ts = new Date().toISOString();
    return record;
  }

  const FORMS_CONFIG = {
    destino_doca: {
      title: 'Destino / Doca',
      csvColumns: [
        { field: 'auditoria', header: 'Auditoría' },
        { field: 'ts', header: 'Fecha/Hora' },
        { field: 'hu', header: 'HU' },
        { field: 'destino', header: 'Destino' },
        { field: 'doca', header: 'Doca' },
        { field: 'resultado', header: 'Resultado' },
      ],
      fields: [],
    },
    fury: {
      title: 'FURY',
      csvColumns: [
        { field: 'auditoria', header: 'Auditoría' },
        { field: 'ts', header: 'Fecha/Hora' },
        { field: 'shipment', header: 'Shipment' },
        { field: 'foto', header: 'Foto' },
        { field: 'situacion', header: 'Situación' },
        { field: 'valor', header: 'Valor' },
      ],
      fields: [{ type: 'photo', id: 'foto' }],
    },
    contenerizado: {
      title: 'Contenerizado',
      csvColumns: [
        { field: 'auditoria', header: 'Auditoría' },
        { field: 'ts', header: 'Fecha/Hora' },
        { field: 'shipment', header: 'Shipment' },
        { field: 'situacion', header: 'Situación' },
        { field: 'foto', header: 'Foto' },
      ],
      fields: [{ type: 'photo', id: 'foto' }],
    },
    linehaul: {
      title: 'Linehaul',
      csvColumns: [
        { field: 'auditoria', header: 'Auditoría' },
        { field: 'ts', header: 'Fecha/Hora' },
        { field: 'hu', header: 'HU' },
        { field: 'area', header: 'Área' },
        { field: 'armado_sitio', header: 'Armado en Sitio' },
        { field: 'origen', header: 'Origen' },
        { field: 'canalizacion', header: 'Canalización' },
        { field: 'foto', header: 'Foto' },
        { field: 'comentarios', header: 'Comentarios' },
      ],
      fields: [{ type: 'photo', id: 'foto' }],
    },
  };

  // Initialize
  const dashboard = new AuditDashboard();
</script>
