<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualización — Barredura / Premissort Contenerizado</title>
  <script src="/d/_libs/plotly.min.js"></script>
  <link rel="stylesheet" href="../css/lib/skeleton.min.css" />
  <style>
    /* ═══════════════════════════════════════════
       NOCTURNE — Grid Design System (subconjunto de solo lectura,
       misma identidad visual que consolidado_auditoria.html)
    ═══════════════════════════════════════════ */
    :root {
      --bg:          #090C0E;
      --surface:     #11161A;
      --surface-2:   #161D22;
      --border:      #1F2830;
      --border-soft: #161C21;
      --accent:        #FFD100;
      --accent-strong: #E6BC00;
      --accent-dim:    #6E5E00;
      --accent-glow:   rgba(255,209,0,.14);
      --on-accent:     #1A1A1A;
      --text:     #F4F6F8;
      --text-sub: #AAB4BC;
      --text-mut: #6B757D;
      --c-green:  #00D689;
      --c-blue:   #5A95FF;
      --c-orange: #FF9E45;
      --c-red:    #FF5C6C;
      --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-pill: 999px;
      --shadow: 0 18px 40px -20px rgba(0,0,0,.7);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      background-image:
        radial-gradient(1000px 640px at 100% -8%, rgba(255,209,0,.09), transparent 55%),
        radial-gradient(760px 520px at -12% 108%, rgba(255,209,0,.04), transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 32px 16px 56px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 40px;
      background: linear-gradient(180deg, rgba(9,12,14,.85), rgba(9,12,14,0));
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    .header-icon {
      width: 36px; height: 36px;
      background: var(--surface);
      border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .header-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .header h1 { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.2; color: var(--text); letter-spacing: -.02em; }
    .header-sub { font-size: 12px; color: var(--text-mut); margin-top: 2px; }

    .header-right { display: flex; align-items: center; gap: 8px; }

    .card {
      background: var(--surface);
      border-radius: var(--r-lg);
      padding: 24px;
      border: 1px solid var(--border);
      max-width: 100%;
      box-sizing: border-box;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 15px; font-weight: 700; color: var(--text);
      margin: 0 0 20px;
      display: flex; align-items: center; gap: 8px;
    }
    .card-title svg { color: var(--accent); flex-shrink: 0; }

    .tabs {
      display: flex; gap: 4px;
      background: var(--surface-2);
      border-radius: var(--r-pill);
      padding: 5px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .tab {
      flex: 1; padding: 9px 8px;
      border: none; border-radius: var(--r-pill);
      background: transparent;
      font-size: 13px; font-weight: 600; color: var(--text-sub);
      cursor: pointer; transition: all .16s; text-align: center;
      font-family: var(--font);
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    }
    .tab.active   { background: var(--surface); color: var(--text); }
    .tab:hover:not(.active) { color: var(--text); background: rgba(255,255,255,.04); }

    .btn-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .16s;
      padding: 0;
      flex-shrink: 0;
    }
    .btn-icon:hover { border-color: var(--accent-dim); color: var(--accent); }
    .btn-icon svg { width: 18px; height: 18px; }
    .btn-icon.spinning svg { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-secondary {
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text-sub); font-size: 13px; padding: 8px 14px;
      border-radius: var(--r-pill); cursor: pointer; font-family: var(--font);
      transition: all .16s;
    }
    .btn-secondary:hover { border-color: var(--accent-dim); color: var(--text); }

    .empty-state { text-align: center; padding: 36px 16px; color: var(--text-mut); font-size: 14px; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 16px;
      text-align: center;
    }
    .kpi-value { font-size: 24px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
    .kpi-label { font-size: 11px; color: var(--text-mut); text-transform: uppercase; letter-spacing: .05em; }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .chart-container {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 16px;
      height: clamp(240px, 34vh, 400px);
      box-sizing: border-box;
      overflow: hidden;
    }
    .chart-container .js-plotly-plot,
    .chart-container .plot-container { width: 100%; height: 100%; }

    .table-wrapper { overflow-x: auto; margin-top: 16px; }
    .table-controls { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .search-input {
      flex: 1; min-width: 200px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 10px 14px;
      font-size: 14px; color: var(--text); font-family: var(--font);
    }
    .search-input::placeholder { color: var(--text-mut); }
    /* Chip de filtro activo por clic en gráfica (drill-down) */
    .chart-filter-chip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-radius: 999px;
      background: rgba(255, 209, 0, .12);
      border: 1px solid var(--accent); color: var(--accent);
      font-size: 12px; font-weight: 600; white-space: nowrap;
    }
    .chart-filter-chip button {
      background: none; border: none; color: inherit;
      font-size: 15px; line-height: 1; cursor: pointer; padding: 0;
    }

    input[type="date"] {
      padding: 6px 8px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
      font-family: var(--font);
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { background: transparent; border-bottom: 1px solid var(--border); }
    th {
      text-align: left; padding: 12px; color: var(--text-mut);
      font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
      white-space: nowrap;
    }
    td { padding: 12px; border-bottom: 1px solid var(--border-soft); color: var(--text); }
    tr:hover { background: rgba(255, 255, 255, .02); }
    .status-good { color: var(--c-green); font-weight: 600; }
    .status-critical { color: var(--c-red); font-weight: 600; }
    .status-warn { color: var(--c-orange); font-weight: 600; }

    .divider { height: 1px; background: var(--border-soft); margin: 20px 0; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    @media (max-width: 640px) {
      .wrap { width: 100%; padding: 24px 16px 48px; }
      .header { padding: 16px 20px; flex-direction: column; gap: 16px; }
      .tabs { border-radius: var(--r-lg); }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .charts-grid { grid-template-columns: 1fr; }
      .chart-container { height: clamp(220px, 46vh, 420px); }
    }

    /* Overlay de carga inicial (misma micro-orb de captura_auditoria.html) — sin esto, el "no hay registros" de abajo se ve momentáneamente como si ya hubiera terminado de cargar y estuviera vacío. */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 3000;
      align-items: center;
      justify-content: center;
    }
    .loading-overlay.active { display: flex; }
    .loading-overlay-content {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      padding: 16px 24px;
      border-radius: var(--r-lg);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }
    .loading-orb {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #27272a;
      flex-shrink: 0;
      transition: all 0.4s ease;
    }
    .loading-orb.saving {
      background: radial-gradient(circle at 30% 30%, #a855f7, #3b82f6, #06b6d4);
      filter: blur(1px);
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
      animation: loading-orb-morph 2s infinite alternate, loading-orb-spin 3s linear infinite;
    }
    .loading-orb.error {
      background: var(--c-red);
      filter: blur(0);
      box-shadow: 0 0 10px rgba(255, 92, 108, 0.6);
      animation: none;
    }
    @keyframes loading-orb-morph {
      0% { border-radius: 40% 60% 60% 40% / 60% 30% 70% 40%; }
      100% { border-radius: 60% 40% 30% 70% / 50% 60% 30% 60%; }
    }
    @keyframes loading-orb-spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<div id="loading-overlay" class="loading-overlay active">
  <div class="loading-overlay-content">
    <div id="loading-orb" class="loading-orb saving"></div>
    <span id="loading-overlay-text">Cargando logs...</span>
  </div>
</div>

<header class="header">
  <div class="brand">
    <div class="header-icon"><img id="header-logo" alt="Logo" /></div>
    <div>
      <h1>Visualización de Logs</h1>
      <div class="header-sub">Solo lectura · sin campos editables</div>
    </div>
  </div>
  <div class="header-right">
    <a class="btn-icon" id="btn-datastudio" title="Abrir dashboard de Data Studio" href="https://datastudio.google.com/reporting/34756cb1-fa59-4b30-a6ee-f2c99dad4230/page/p_1eapajygzd" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 20V10M12 20V4M6 20v-6"/>
      </svg>
    </a>
    <button class="btn-icon" id="btn-download-filtered" title="Exportar registros filtrados (CSV) — respeta rango de fecha y drill-down activos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 3v13m0 0l-4-4m4 4l4-4M4 21h16"/>
      </svg>
    </button>
    <button class="btn-icon" id="btn-refresh" title="Actualizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 4v6h-6"/>
        <path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
      </svg>
    </button>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <div class="tabs" id="log-tabs" style="display: none;"></div>

    <!-- Filtro de fecha fuera de analysis-content a propósito: debe seguir
         visible aunque el rango/log actual no tenga registros. -->
    <div style="display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; align-items: center;">
      <label style="font-size: 0.85rem; color: var(--text-mut);">Filtrar por fecha:</label>
      <input type="date" id="date-from" />
      <span style="color: var(--text-mut);">hasta</span>
      <input type="date" id="date-to" />
      <button id="btn-clear-filters" class="btn-secondary" style="font-size: 0.85rem;">Limpiar</button>
    </div>

    <div id="no-data-message" class="empty-state">
      <p>Todavía no hay registros sincronizados.</p>
    </div>

    <div id="analysis-content" style="display: none;">
      <div class="kpi-grid" id="kpi-grid"></div>
      <div class="charts-grid" id="charts-grid"></div>

      <div class="table-wrapper">
        <div class="table-controls">
          <input type="text" class="search-input" id="search-input" placeholder="Buscar en registros…" />
          <div id="chart-filter-chip" class="chart-filter-chip" style="display: none;">
            <span id="chart-filter-chip-label"></span>
            <button type="button" id="chart-filter-chip-clear" aria-label="Quitar filtro de gráfica" title="Quitar filtro">&times;</button>
          </div>
        </div>
        <table id="records-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
        <div style="display: flex; gap: 12px; margin-top: 12px; justify-content: center; align-items: center;">
          <button id="btn-load-more" class="btn-secondary" style="font-size: 0.85rem; display: none;">Cargar más</button>
          <span id="pagination-info" style="color: var(--text-mut); font-size: 0.85rem;"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/**
 * Visualización de logs — dashboard adicional, SOLO LECTURA. Lee los mismos
 * State Buckets shardeados que consolidado_auditoria.html, apuntando a la
 * misma bóveda de datos por defecto — no tiene ninguna acción que escriba:
 * sin editar, sin borrar, sin subir catálogo. Pensado para compartirse con
 * gente que solo necesita ver el estado de estos logs sin tocar nada.
 *
 * Empezó como un visor de un solo log (Barredura, leyendo un único
 * "barredura_master" fijo) y se generalizó a un patrón de tabs para poder
 * agregar más logs (Premissort) sin duplicar el archivo — mismo patrón de
 * tabs que el dashboard original. Al generalizar también se corrigió un bug
 * real: el visor de Barredura leía solo el bucket legacy "barredura_master"
 * y nunca los shards diarios vigentes desde el cutover (2026-08-14), así
 * que llevaba días mostrando datos incompletos. Ambos logs mostrados aquí
 * están shardeados por día — ver masterBucketNameFor/loadShardedLog.
 */
const SHARD_CUTOVER_DATE = '2026-08-14';

/** Fecha calendario (hora de México, UTC-6 fijo) de un ts ISO, sea "Z" o con offset explícito. */
function shardDateKeyMexico(ts) {
  const instant = new Date(ts);
  const mx = new Date(instant.getTime() - 6 * 60 * 60 * 1000);
  const pad = (n) => String(n).padStart(2, '0');
  return `${mx.getUTCFullYear()}-${pad(mx.getUTCMonth() + 1)}-${pad(mx.getUTCDate())}`;
}

/** Nombre del bucket master que corresponde a un formId + fecha (o ts de un registro). Ambos logs de este visor están shardeados. */
function masterBucketNameFor(formId, tsOrDateKey) {
  const dateKey = /^\d{4}-\d{2}-\d{2}$/.test(String(tsOrDateKey)) ? tsOrDateKey : shardDateKeyMexico(tsOrDateKey);
  return dateKey < SHARD_CUTOVER_DATE ? `${formId}_master` : `${formId}_master_${dateKey}`;
}

/** Nombres de shard para cubrir un rango de fechas de calendario (los elegidos en date-from/date-to, sin conversión de huso horario). */
function shardNamesForRange(formId, fromDate, toDate) {
  const names = new Set();
  const pad = (n) => String(n).padStart(2, '0');
  let cursor = Date.UTC(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
  const end = Date.UTC(toDate.getFullYear(), toDate.getMonth(), toDate.getDate());
  while (cursor <= end) {
    const d = new Date(cursor);
    const dateKey = `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
    names.add(masterBucketNameFor(formId, dateKey));
    cursor += 24 * 60 * 60 * 1000;
  }
  return names;
}

const LOG_TITLES = {
  barredura: 'Barredura',
  premissort: 'Premissort Contenerizado',
};

const BARREDURA_COLUMNS = [
  { field: 'auditoria', header: 'Auditoría' },
  { field: 'ts', header: 'Fecha/Hora' },
  { field: 'hu', header: 'HU' },
  { field: 'shipment_id', header: 'Shipment ID' },
  { field: 'lugar', header: 'Lugar' },
  { field: 'estado', header: 'Estado' },
  { field: 'dias_en_sitio', header: 'Días en Sitio' },
  { field: 'hub_status', header: 'HUB Status' },
  { field: 'usuario_dispatch', header: 'Usuario Dispatch' },
  { field: 'logistic_center', header: 'Logistic Center' },
  { field: 'fecha_ultimo_estado', header: 'Fecha Último Estado' },
  { field: 'total_shipments_por_hu', header: 'Total Shipments por HU' },
  { field: 'caso', header: 'Caso' },
  { field: 'costo_usd', header: 'Costo USD' },
];

const PREMISSORT_COLUMNS = [
  { field: 'auditoria', header: 'Auditoría' },
  { field: 'ts', header: 'Fecha/Hora' },
  { field: 'posicion', header: 'Posición' },
  { field: 'hu', header: 'HU' },
  { field: 'shipment_id', header: 'Shipment ID' },
  { field: 'estado', header: 'Estado' },
  { field: 'detalle', header: 'Detalle' },
];

const LOG_COLUMNS = {
  barredura: BARREDURA_COLUMNS,
  premissort: PREMISSORT_COLUMNS,
};

/**
 * El estado "encontrado en catálogo" de Barredura ha tenido 3 nombres
 * ('En catálogo' → 'Backlog esperado' → 'Dentro de catálogo') según
 * cambios de terminología — acepta cualquiera para que los registros
 * viejos se sigan contando/mostrando bien.
 */
function isDentroDeCatalogo(estado) {
  return estado === 'En catálogo' || estado === 'Backlog esperado' || estado === 'Dentro de catálogo';
}

/**
 * Un paquete "no contenerizado" es un hallazgo de la auditoría en sí mismo
 * (no llegó a asignarse a ningún container/posición en BigQuery), no solo
 * un caso técnico de "no se pudo consultar". El estado ha tenido 2 nombres
 * antes de este ('Sobrante - fuera de catálogo' cuando Premissort todavía
 * dependía de un catálogo subido, luego 'Sobrante - no localizado') — se
 * acepta cualquiera para que los registros viejos se sigan contando bien.
 */
function isNoContenerizado(estado) {
  return estado === 'Sobrante - no contenerizado'
    || estado === 'Sobrante - no localizado'
    || estado === 'Sobrante - fuera de catálogo';
}

/**
 * Un Missort de Premissort es un paquete que se encontró (o sigue) fuera
 * de la posición donde debía estar — esa es la razón de ser de esta
 * auditoría, así que debe quedar visible como tal, no diluido dentro de
 * "Encontrado" genérico. Dos formas, según si ya se reubicó o no:
 *   - Ya reubicado: estado 'Encontrado' con detalle "Reubicado desde X"
 *     (ver PremissortSession.saveMisplaced en captura_auditoria.html).
 *   - Todavía sin reubicar: estado 'Sobrante - pendiente reubicar'.
 */
function isMissort(record) {
  if (record.estado === 'Sobrante - pendiente reubicar') return true;
  return record.estado === 'Encontrado' && /^Reubicado desde /.test(record.detalle || '');
}

/**
 * `new Date("2026-08-13")` (el valor crudo de un <input type="date">) se
 * interpreta como medianoche UTC, no medianoche local — para alguien en
 * México (UTC-6) eso corre el filtro 6 horas hacia atrás, mostrando el día
 * equivocado cerca de la medianoche. Se arma la fecha con los componentes
 * año/mes/día directamente en el constructor local de Date para evitar el
 * parseo UTC por completo.
 */
function parseLocalDateInput(value) {
  if (!value) return null;
  const [y, m, d] = value.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function hasCosto(record) {
  return record.costo_usd !== undefined && record.costo_usd !== null && String(record.costo_usd).trim() !== '';
}

/** ¿Este registro de Barredura debería tener un Costo USD capturado? Fuera de catálogo, o despachado. */
function needsCosto(record) {
  return !isDentroDeCatalogo(record.estado) || record.caso === 'Despachado';
}

// Valores de "lugar"/"caso" reconocidos (enum de la app de captura). Todo
// lo demás es texto libre que el operador escribió tras elegir "Otro" — en
// las gráficas se agrupa en una sola barra "Otro" en vez de una barra
// distinta por cada texto manual. Incluye "Despacho" (nombre anterior de
// la zona, antes de renombrarse a "Staging") para que el historial viejo
// siga contando como zona real y no como texto libre.
const KNOWN_LUGARES = [
  'Sorting Large', 'Sorting GM1', 'Sorting GM2', 'Inbound FM', 'Inbound LH',
  'Mesa de Ayuda', 'Inventarios', 'Staging', 'Despacho',
  'Staging - V3', 'Staging - Otro', 'Despacho - V3', 'Despacho - Otro',
];
const KNOWN_CASOS = ['Sin recepción', 'Despachado', 'Con estatus BPP', 'Missort'];

function bucketLugar(lugar) {
  const v = (lugar || '').toString().trim();
  if (!v) return '(sin dato)';
  return KNOWN_LUGARES.includes(v) ? v : 'Otro';
}

function bucketCaso(caso) {
  const v = (caso || '').toString().trim();
  if (!v) return '(sin caso)';
  return KNOWN_CASOS.includes(v) ? v : 'Otro';
}

/**
 * Overlay de carga inicial (misma micro-orb de captura_auditoria.html) —
 * arranca activo en el HTML (ver <body>) para que nunca haya un frame de
 * "Todavía no hay registros sincronizados" antes de que este script
 * termine de cargar; init() lo oculta cuando loadAllLogs() termina, o lo
 * deja en estado error si falla.
 */
const LoadingOverlay = (() => {
  let overlayEl, orbEl, textEl;

  function refs() {
    if (!overlayEl) {
      overlayEl = document.getElementById('loading-overlay');
      orbEl = document.getElementById('loading-orb');
      textEl = document.getElementById('loading-overlay-text');
    }
    return !!overlayEl;
  }

  function show(text = 'Cargando logs...') {
    if (!refs()) return;
    overlayEl.classList.add('active');
    orbEl.className = 'loading-orb saving';
    textEl.textContent = text;
  }

  function error(text = 'No se pudieron cargar los logs') {
    if (!refs()) return;
    orbEl.className = 'loading-orb error';
    textEl.textContent = text;
  }

  function hide() {
    if (!refs()) return;
    overlayEl.classList.remove('active');
  }

  return { show, error, hide };
})();

class GridClient {
  constructor(docId) {
    this.docId = docId;
    this.baseUrl = location.origin;
  }

  async downloadDocumentAsObjectUrl(docId) {
    try {
      const metaRes = await fetch(`${this.baseUrl}/api/v1/documents/${docId}/download`, { credentials: 'include' });
      if (!metaRes.ok) throw new Error(`${metaRes.status}`);
      const meta = await metaRes.json();
      const url = meta.download_url || meta.agent_download_url;
      if (!url) throw new Error('No se encontró download_url en la respuesta');
      const blobRes = await fetch(url, { credentials: 'include' });
      if (!blobRes.ok) throw new Error(`${blobRes.status}`);
      const blob = await blobRes.blob();
      return URL.createObjectURL(blob);
    } catch (e) {
      console.warn(`downloadDocumentAsObjectUrl ${docId}:`, e);
      return null;
    }
  }

  /**
   * Errores 503 de Grid ("object-storage is temporarily unavailable")
   * traen retry:true explícito en el body — hay que reintentar, no
   * tratarlo como cualquier otro error, o el visor muestra menos
   * registros de los que en realidad hay por una falla transitoria.
   */
  _shouldRetryStatus(status, bodyText) {
    if (status === 503) return true;
    try {
      return !!JSON.parse(bodyText).retry;
    } catch (e) {
      return false;
    }
  }

  async getStateBucket(name, attempt = 0) {
    try {
      const res = await fetch(`${this.baseUrl}/api/v1/documents/${this.docId}/states/${name}`, { credentials: 'include' });
      if (res.status === 404) return null;
      if (!res.ok) {
        const bodyText = await res.text().catch(() => '');
        if (this._shouldRetryStatus(res.status, bodyText) && attempt < 5) {
          await new Promise((r) => setTimeout(r, 500 * (attempt + 1) + Math.random() * 300));
          return this.getStateBucket(name, attempt + 1);
        }
        throw new Error(`${res.status}`);
      }
      const body = await res.json();
      return body.state ?? null;
    } catch (e) {
      console.error(`getStateBucket ${name}:`, e);
      return null;
    }
  }
}

class LogViewer {
  constructor() {
    const params = new URLSearchParams(location.search);
    this.docId = params.get('data_doc_id') || '01KZPRK3PDWP9TG0RKW3J9JGN7';
    this.gridClient = new GridClient(this.docId);
    this.logs = { barredura: [], premissort: [] };
    this.currentLog = 'barredura';
    this.dateFrom = null;
    this.dateTo = null;
    this.displayedCount = 10;
    this._chartsRafId = null;
    // Drill-down: clic en una porción/barra de una gráfica filtra la tabla
    // de abajo. { chartKey, label, predicate }. Se limpia al cambiar de log
    // o de cualquier otro filtro, para no dejar un filtro "fantasma" sobre
    // un set de datos distinto al que lo generó.
    this.chartFilter = null;
    this.init();
  }

  async init() {
    this.setupEventListeners();
    this.loadHeaderLogo();

    // Rango de fechas por defecto: ayer y hoy (el usuario lo puede ampliar
    // manualmente desde los inputs date-from/date-to). getFullYear/Month/
    // Date en vez de toISOString: toISOString usa UTC y desfasa el día
    // durante la tarde/noche en México (UTC-6).
    const pad = (n) => String(n).padStart(2, '0');
    const toInputValue = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const today = new Date();
    const yesterday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);
    this.dateFrom = yesterday;
    this.dateTo = today;
    document.getElementById('date-from').value = toInputValue(yesterday);
    document.getElementById('date-to').value = toInputValue(today);

    try {
      await this.loadAllLogs();
      LoadingOverlay.hide();
    } catch (e) {
      LoadingOverlay.error('No se pudieron cargar los logs');
    }
  }

  async loadHeaderLogo() {
    const logoDocId = '01KTD4Q8GC7Y620F9F9WEXGDE4';
    const objectUrl = await this.gridClient.downloadDocumentAsObjectUrl(logoDocId);
    if (objectUrl) document.getElementById('header-logo').src = objectUrl;
  }

  setupEventListeners() {
    document.getElementById('btn-refresh').addEventListener('click', () => this.refresh());
    document.getElementById('btn-download-filtered').addEventListener('click', () => this.downloadFiltered());
    document.getElementById('search-input').addEventListener('input', (e) => this.filterTable(e.target.value));
    document.getElementById('date-from').addEventListener('change', async (e) => {
      this.dateFrom = parseLocalDateInput(e.target.value);
      this.displayedCount = 10;
      this.chartFilter = null;
      await this.loadAllLogs();
    });
    document.getElementById('date-to').addEventListener('change', async (e) => {
      this.dateTo = parseLocalDateInput(e.target.value);
      this.displayedCount = 10;
      this.chartFilter = null;
      await this.loadAllLogs();
    });
    document.getElementById('btn-clear-filters').addEventListener('click', async () => {
      this.dateFrom = null;
      this.dateTo = null;
      document.getElementById('date-from').value = '';
      document.getElementById('date-to').value = '';
      this.displayedCount = 10;
      this.chartFilter = null;
      await this.loadAllLogs();
    });
    document.getElementById('btn-load-more').addEventListener('click', () => {
      this.displayedCount += 10;
      this.render();
    });
    document.getElementById('chart-filter-chip-clear').addEventListener('click', () => {
      this.chartFilter = null;
      this.displayedCount = 10;
      this.render();
    });
  }

  /**
   * Lee los shards diarios de un log que caen dentro del rango de fechas
   * actual (sin dateFrom = todo lo que alguna vez tuvo datos, vía
   * {formId}_shard_registry — bucket minúsculo, no crece con el volumen de
   * registros). Concurrencia limitada para no lanzar decenas de GET
   * simultáneos si el rango es amplio.
   */
  async loadShardedLog(formId) {
    let shardNames;
    if (!this.dateFrom) {
      const registry = await this.gridClient.getStateBucket(`${formId}_shard_registry`);
      const dates = registry && registry.dates ? Object.keys(registry.dates) : [];
      shardNames = new Set([`${formId}_master`, ...dates.map((d) => masterBucketNameFor(formId, d))]);
    } else {
      shardNames = shardNamesForRange(formId, this.dateFrom, this.dateTo || new Date());
    }

    const names = [...shardNames];
    const CONCURRENCY = 4;
    const records = [];
    for (let i = 0; i < names.length; i += CONCURRENCY) {
      const batch = names.slice(i, i + CONCURRENCY);
      const batchResults = await Promise.all(batch.map((name) => this.gridClient.getStateBucket(name)));
      batchResults.forEach((data) => {
        if (data && Array.isArray(data.records)) records.push(...data.records);
      });
    }
    return records;
  }

  async loadAllLogs() {
    for (const formId of Object.keys(this.logs)) {
      this.logs[formId] = await this.loadShardedLog(formId);
    }
    // Si el log activo quedó sin datos (o es la carga inicial), salta al
    // primero que sí tenga, para no mostrar "sin registros" innecesariamente.
    if (!this.logs[this.currentLog] || this.logs[this.currentLog].length === 0) {
      const firstWithData = Object.entries(this.logs).find(([, records]) => records.length > 0);
      if (firstWithData) this.currentLog = firstWithData[0];
    }
    this.renderTabs();
    this.render();
  }

  async refresh() {
    const btn = document.getElementById('btn-refresh');
    if (btn.classList.contains('spinning')) return;
    btn.classList.add('spinning');
    btn.disabled = true;
    try {
      await this.loadAllLogs();
    } finally {
      btn.classList.remove('spinning');
      btn.disabled = false;
    }
  }

  renderTabs() {
    const container = document.getElementById('log-tabs');
    const hasAny = Object.values(this.logs).some(r => r.length > 0);

    if (!hasAny) {
      container.style.display = 'none';
      return;
    }

    container.style.display = 'flex';
    container.innerHTML = '';

    for (const [logType, records] of Object.entries(this.logs)) {
      if (records.length === 0) continue;
      const tab = document.createElement('button');
      tab.className = `tab ${logType === this.currentLog ? 'active' : ''}`;
      tab.textContent = LOG_TITLES[logType] || logType;
      tab.addEventListener('click', () => {
        this.currentLog = logType;
        this.displayedCount = 10;
        this.chartFilter = null;
        this.render();
        this.renderTabs();
      });
      container.appendChild(tab);
    }
  }

  render() {
    const records = this.logs[this.currentLog] || [];
    if (records.length === 0) {
      document.getElementById('no-data-message').style.display = 'block';
      document.getElementById('analysis-content').style.display = 'none';
      return;
    }

    const filteredRecords = this.getFilteredRecords();

    if (filteredRecords.length === 0) {
      document.getElementById('no-data-message').style.display = 'block';
      document.getElementById('analysis-content').style.display = 'none';
      return;
    }

    document.getElementById('no-data-message').style.display = 'none';
    document.getElementById('analysis-content').style.display = 'block';

    this.renderKpis(filteredRecords);

    // Drill-down por clic en gráfica: solo estrecha la tabla de abajo, no
    // los KPIs ni las gráficas — así la gráfica sigue mostrando la
    // distribución completa como referencia mientras la tabla se enfoca
    // en la porción/barra elegida.
    const tableRecords = this.chartFilter
      ? filteredRecords.filter(this.chartFilter.predicate)
      : filteredRecords;
    this.renderChartFilterChip();

    const displayedRecords = tableRecords.slice(0, this.displayedCount);
    this.renderTable(displayedRecords);

    const btnLoadMore = document.getElementById('btn-load-more');
    const paginationInfo = document.getElementById('pagination-info');
    if (tableRecords.length > this.displayedCount) {
      btnLoadMore.style.display = 'inline-block';
      paginationInfo.textContent = `Mostrando ${displayedRecords.length} de ${tableRecords.length}`;
    } else {
      btnLoadMore.style.display = 'none';
      paginationInfo.textContent = `Total: ${tableRecords.length}`;
    }

    this.renderCharts(filteredRecords);
  }

  /**
   * Exporta el log actualmente seleccionado respetando TODOS los filtros
   * activos: rango de fecha (getFilteredRecords) y el drill-down de
   * gráfica activo (chartFilter) — igual que hace filterTable()/render()
   * para la tabla.
   */
  downloadFiltered() {
    let records = this.getFilteredRecords();
    if (this.chartFilter) records = records.filter(this.chartFilter.predicate);

    if (records.length === 0) {
      alert('No hay registros en el rango/filtro seleccionado');
      return;
    }

    const columns = LOG_COLUMNS[this.currentLog] || [];
    const filenameSlug = this.currentLog.replace(/[^a-z0-9_]/gi, '');
    this.downloadCsv(`${filenameSlug}_${new Date().toISOString().split('T')[0]}.csv`, columns, records);
  }

  // Descarga un CSV genérico (con BOM UTF-8) a partir de encabezados + filas de objetos.
  downloadCsv(filename, headers, rows) {
    const escapeCsv = (val) => {
      if (val === null || val === undefined) return '';
      const str = String(val);
      return (str.includes(',') || str.includes('"') || str.includes('\n'))
        ? '"' + str.replace(/"/g, '""') + '"'
        : str;
    };
    const lines = [headers.map(h => escapeCsv(h.header)).join(',')];
    rows.forEach(row => {
      lines.push(headers.map(h => escapeCsv(row[h.field])).join(','));
    });
    const csv = '﻿' + lines.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  /** Chip "Filtrando por: X" cuando hay un drill-down activo desde una gráfica. */
  renderChartFilterChip() {
    const chip = document.getElementById('chart-filter-chip');
    const label = document.getElementById('chart-filter-chip-label');
    if (this.chartFilter) {
      chip.style.display = 'inline-flex';
      label.textContent = `Filtrando por: ${this.chartFilter.label}`;
    } else {
      chip.style.display = 'none';
    }
  }

  getFilteredRecords() {
    let records = this.logs[this.currentLog] || [];

    if (this.dateFrom || this.dateTo) {
      records = records.filter(r => {
        const recDate = r.ts ? new Date(r.ts) : null;
        if (!recDate) return true;
        if (this.dateFrom && recDate < this.dateFrom) return false;
        if (this.dateTo) {
          const dateToEndOfDay = new Date(this.dateTo);
          dateToEndOfDay.setHours(23, 59, 59, 999);
          if (recDate > dateToEndOfDay) return false;
        }
        return true;
      });
    }

    return records.slice().sort((a, b) => {
      const aDate = a.ts ? new Date(a.ts).getTime() : 0;
      const bDate = b.ts ? new Date(b.ts).getTime() : 0;
      return bDate - aDate;
    });
  }

  renderKpis(records) {
    const container = document.getElementById('kpi-grid');
    container.innerHTML = '';
    const total = records.length;

    if (this.currentLog === 'barredura') {
      this.addKpiCard(container, total.toString(), 'Total');
      const enCatalogo = records.filter(r => isDentroDeCatalogo(r.estado)).length;
      this.addKpiCard(container, enCatalogo.toString(), 'Dentro de catálogo');
      this.addKpiCard(container, (total - enCatalogo).toString(), 'Fuera de catálogo');
      const conCaso = records.filter(r => (r.caso || '').trim()).length;
      if (conCaso > 0) this.addKpiCard(container, conCaso.toString(), 'Con caso');
      const totalCosto = records.reduce((sum, r) => sum + (Number(r.costo_usd) || 0), 0);
      if (totalCosto > 0) this.addKpiCard(container, `$${totalCosto.toFixed(2)}`, 'Costo USD');
      const sinCosto = records.filter(r => needsCosto(r) && !hasCosto(r)).length;
      if (sinCosto > 0) this.addKpiCard(container, sinCosto.toString(), 'Sin costo capturado');
    } else if (this.currentLog === 'premissort') {
      this.addKpiCard(container, total.toString(), 'Total');
      // Missort y No contenerizado primero: son los dos hallazgos que
      // busca esta auditoría, no casos técnicos secundarios.
      const missorts = records.filter(isMissort).length;
      this.addKpiCard(container, missorts.toString(), 'Missorts');
      const noContenerizado = records.filter(r => isNoContenerizado(r.estado)).length;
      this.addKpiCard(container, noContenerizado.toString(), 'No contenerizado');
      const encontrados = records.filter(r => r.estado === 'Encontrado').length;
      this.addKpiCard(container, encontrados.toString(), 'Encontrados');
      const pendienteReubicar = records.filter(r => r.estado === 'Sobrante - pendiente reubicar').length;
      if (pendienteReubicar > 0) this.addKpiCard(container, pendienteReubicar.toString(), 'Missort — pendiente reubicar');
      const posiciones = new Set(records.map(r => r.posicion).filter(Boolean)).size;
      this.addKpiCard(container, posiciones.toString(), 'Posiciones escaneadas');
    }
  }

  addKpiCard(container, value, label) {
    const card = document.createElement('div');
    card.className = 'kpi-card';
    card.innerHTML = `<div class="kpi-value">${value}</div><div class="kpi-label">${label}</div>`;
    container.appendChild(card);
  }

  countByField(records, field) {
    const counts = {};
    records.forEach(r => {
      const key = (r[field] || '').toString().trim() || '(sin dato)';
      counts[key] = (counts[key] || 0) + 1;
    });
    return counts;
  }

  /** Un predicado de drill-down por cada label, reproduciendo el mismo bucketing que countByField. */
  fieldPredicates(field, labels) {
    const predicates = {};
    labels.forEach((label) => {
      predicates[label] = (r) => ((r[field] || '').toString().trim() || '(sin dato)') === label;
    });
    return predicates;
  }

  renderCharts(records) {
    const container = document.getElementById('charts-grid');

    if (typeof Plotly === 'undefined') {
      container.innerHTML = '';
      const warn = document.createElement('div');
      warn.className = 'empty-state';
      warn.textContent = 'Plotly no está disponible en este entorno.';
      container.appendChild(warn);
      return;
    }

    if (this._chartsRafId) cancelAnimationFrame(this._chartsRafId);

    this._chartsRafId = requestAnimationFrame(() => {
      this._chartsRafId = null;
      container.innerHTML = '';

      let builders = [];
      if (this.currentLog === 'barredura') {
        builders = [
          () => this.buildBarreduraEstadoChart(records),
          () => this.buildLugarChart(records),
          () => this.buildCasoCountChart(records),
          () => this.buildCostoChart(records),
        ];
      } else if (this.currentLog === 'premissort') {
        builders = [
          () => this.buildPremissortMissortChart(records),
          () => this.buildPremissortEstadoChart(records),
        ];
      }

      // Fase 1: crear y anexar TODOS los divs primero. Con CSS Grid
      // (auto-fit), el número de columnas depende de cuántos items hay en
      // el momento de medir: si se dibuja el primer gráfico antes de que
      // existan los demás divs, el grid colapsa a 1 sola columna a ancho
      // completo, Plotly mide ese ancho incorrecto, y cuando el grid se
      // reacomoda al llegar los siguientes divs, el SVG ya dibujado no se
      // vuelve a medir solo — queda descuadrado y recortado por el
      // overflow:hidden del contenedor.
      const specs = builders.map((build) => {
        const div = document.createElement('div');
        div.className = 'chart-container';
        container.appendChild(div);
        return { div, ...build() };
      });

      // Fase 2: con el grid ya en su layout final, dibujar cada gráfica.
      specs.forEach(({ div, data, layout, chartKey, labels, predicates }) => {
        // Si esta gráfica tiene una porción/barra elegida por drill-down,
        // se resalta sin tener que cambiar su paleta de colores: en pie se
        // "saca" (pull) y lleva borde; en barra, se atenúa todo lo demás
        // (opacity) y la elegida queda al 100%.
        if (chartKey && predicates && this.chartFilter && this.chartFilter.chartKey === chartKey) {
          const idx = labels.indexOf(this.chartFilter.label);
          if (idx !== -1) {
            if (data[0].type === 'pie') {
              data[0].pull = labels.map((_, i) => (i === idx ? 0.06 : 0));
              data[0].marker = {
                ...data[0].marker,
                line: { color: '#F4F6F8', width: labels.map((_, i) => (i === idx ? 2 : 0)) },
              };
            } else {
              data[0].marker = {
                ...data[0].marker,
                opacity: labels.map((_, i) => (i === idx ? 1 : 0.35)),
              };
            }
          }
        }

        Plotly.newPlot(div, data, layout, { responsive: true, displayModeBar: false });

        // Drill-down: clic en una porción/barra filtra la tabla de abajo
        // por esa categoría; clic de nuevo sobre la misma la quita.
        if (chartKey && predicates) {
          div.style.cursor = 'pointer';
          div.on('plotly_click', (evt) => {
            const pt = evt.points && evt.points[0];
            if (!pt) return;
            const label = labels[pt.pointNumber];
            const isSame = this.chartFilter
              && this.chartFilter.chartKey === chartKey
              && this.chartFilter.label === label;
            this.chartFilter = isSame ? null : { chartKey, label, predicate: predicates[label] };
            this.displayedCount = 10;
            this.render();
          });
        }
      });
    });
  }

  /** Costo USD capturado por tipo de caso (suma). */
  buildCostoChart(records) {
    const totals = {};
    records.forEach((r) => {
      const caso = bucketCaso(r.caso);
      totals[caso] = (totals[caso] || 0) + (Number(r.costo_usd) || 0);
    });
    const casos = Object.keys(totals);
    const predicates = {};
    casos.forEach((caso) => { predicates[caso] = (r) => bucketCaso(r.caso) === caso; });

    return {
      data: [{
        x: casos,
        y: casos.map((c) => totals[c]),
        type: 'bar',
        marker: { color: '#E6BC00' },
      }],
      layout: {
        title: 'Costo USD por Caso',
        xaxis: { automargin: true, tickangle: -30 },
        yaxis: { title: 'USD', automargin: true },
        plot_bgcolor: 'transparent',
        paper_bgcolor: 'transparent',
        font: { color: '#F4F6F8', size: 11 },
        margin: { l: 50, r: 30, t: 40, b: 60 },
      },
      chartKey: 'costo', labels: casos, predicates,
    };
  }

  /** Cantidad de registros por tipo de caso (conteo, no costo). */
  buildCasoCountChart(records) {
    const counts = this.countByField(records.map(r => ({ caso: bucketCaso(r.caso) })), 'caso');
    const casos = Object.keys(counts);
    const predicates = {};
    casos.forEach((caso) => { predicates[caso] = (r) => bucketCaso(r.caso) === caso; });

    return {
      data: [{
        x: casos,
        y: casos.map((c) => counts[c]),
        type: 'bar',
        marker: { color: '#D4AF37' },
      }],
      layout: {
        title: 'Cantidad por tipo de Caso',
        xaxis: { automargin: true, tickangle: -30 },
        yaxis: { title: 'Cantidad', automargin: true },
        plot_bgcolor: 'transparent',
        paper_bgcolor: 'transparent',
        font: { color: '#F4F6F8', size: 11 },
        margin: { l: 50, r: 30, t: 40, b: 60 },
      },
      chartKey: 'caso-count', labels: casos, predicates,
    };
  }

  buildBarreduraEstadoChart(records) {
    const enCatalogo = records.filter(r => isDentroDeCatalogo(r.estado)).length;
    const fueraCatalogo = records.length - enCatalogo;
    const labels = ['Dentro de catálogo', 'Fuera de catálogo'];
    const predicates = {
      'Dentro de catálogo': (r) => isDentroDeCatalogo(r.estado),
      'Fuera de catálogo': (r) => !isDentroDeCatalogo(r.estado),
    };

    return {
      data: [{
        labels,
        values: [enCatalogo, fueraCatalogo],
        type: 'pie',
        hole: 0.45,
        sort: false,
        textinfo: 'percent',
        textfont: { size: 11 },
        marker: { colors: ['#FFD100', '#8A7300'] },
      }],
      layout: {
        title: 'Estado del escaneo',
        plot_bgcolor: 'transparent',
        paper_bgcolor: 'transparent',
        font: { color: '#F4F6F8', size: 11 },
        showlegend: true,
        legend: { orientation: 'h', x: 0.5, xanchor: 'center', y: -0.1 },
        margin: { l: 20, r: 20, t: 40, b: 50 },
      },
      chartKey: 'barredura-estado', labels, predicates,
    };
  }

  /** Los dos hallazgos que busca esta auditoría: Missort (ver isMissort) y No contenerizado (ver isNoContenerizado). */
  buildPremissortMissortChart(records) {
    const pendienteTest = (r) => r.estado === 'Sobrante - pendiente reubicar';
    const reubicadoTest = (r) => r.estado === 'Encontrado' && /^Reubicado desde /.test(r.detalle || '');
    const noContenerizadoTest = (r) => isNoContenerizado(r.estado);
    const sinHallazgoTest = (r) => !pendienteTest(r) && !reubicadoTest(r) && !noContenerizadoTest(r);

    const pendiente = records.filter(pendienteTest).length;
    const reubicado = records.filter(reubicadoTest).length;
    const noContenerizado = records.filter(noContenerizadoTest).length;
    const sinHallazgo = records.length - pendiente - reubicado - noContenerizado;

    const labels = ['Sin hallazgo', 'Missort — reubicado', 'Missort — pendiente', 'No contenerizado'];
    const predicates = {
      'Sin hallazgo': sinHallazgoTest,
      'Missort — reubicado': reubicadoTest,
      'Missort — pendiente': pendienteTest,
      'No contenerizado': noContenerizadoTest,
    };

    return {
      data: [{
        labels,
        values: [sinHallazgo, reubicado, pendiente, noContenerizado],
        type: 'pie',
        hole: 0.45,
        sort: false,
        textinfo: 'percent',
        textfont: { size: 11 },
        marker: { colors: ['#FFD100', '#FF9E45', '#FF5C6C', '#8A7300'] },
      }],
      layout: {
        title: 'Hallazgos de la auditoría',
        plot_bgcolor: 'transparent',
        paper_bgcolor: 'transparent',
        font: { color: '#F4F6F8', size: 11 },
        showlegend: true,
        legend: { orientation: 'h', x: 0.5, xanchor: 'center', y: -0.15 },
        margin: { l: 20, r: 20, t: 40, b: 50 },
      },
      chartKey: 'premissort-missort', labels, predicates,
    };
  }

  buildPremissortEstadoChart(records) {
    const counts = this.countByField(records, 'estado');
    const estados = Object.keys(counts);

    return {
      data: [{
        x: estados,
        y: estados.map((e) => counts[e]),
        type: 'bar',
        marker: { color: '#FFD100' },
      }],
      layout: {
        title: 'Distribución por Estado',
        xaxis: { automargin: true, tickangle: -30 },
        yaxis: { title: 'Cantidad', automargin: true },
        plot_bgcolor: 'transparent',
        paper_bgcolor: 'transparent',
        font: { color: '#F4F6F8', size: 11 },
        margin: { l: 50, r: 30, t: 40, b: 60 },
      },
      chartKey: 'premissort-estado', labels: estados, predicates: this.fieldPredicates('estado', estados),
    };
  }

  buildLugarChart(records) {
    const counts = this.countByField(records.map(r => ({ lugar: bucketLugar(r.lugar) })), 'lugar');
    const labels = Object.keys(counts);
    const predicates = {};
    labels.forEach((label) => { predicates[label] = (r) => bucketLugar(r.lugar) === label; });

    return {
      data: [{
        x: labels,
        y: Object.values(counts),
        type: 'bar',
        marker: { color: '#FFD100' },
      }],
      layout: {
        title: 'Escaneos por lugar',
        xaxis: { automargin: true, tickangle: -30 },
        yaxis: { title: 'Cantidad', automargin: true },
        plot_bgcolor: 'transparent',
        paper_bgcolor: 'transparent',
        font: { color: '#F4F6F8', size: 11 },
        margin: { l: 50, r: 30, t: 40, b: 60 },
      },
      chartKey: 'lugar', labels, predicates,
    };
  }

  renderTable(records) {
    const thead = document.getElementById('table-head');
    const tbody = document.getElementById('table-body');
    thead.innerHTML = '';
    tbody.innerHTML = '';

    const columns = LOG_COLUMNS[this.currentLog] || [];

    const tr = document.createElement('tr');
    columns.forEach(col => {
      const th = document.createElement('th');
      th.textContent = col.header;
      tr.appendChild(th);
    });
    thead.appendChild(tr);

    records.forEach((record) => {
      const tr = document.createElement('tr');
      columns.forEach(col => {
        const td = document.createElement('td');
        const value = record[col.field] || '';

        if (col.field === 'ts') {
          td.textContent = value ? new Date(value).toLocaleString('es-MX', {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
          }) : '';
        } else if (col.field === 'auditoria') {
          // Registros viejos guardaron el correo completo; ahora se
          // guarda el LDAP. Se muestra solo el LDAP en ambos casos.
          td.textContent = value.replace(/@.*$/, '');
        } else if (this.currentLog === 'barredura' && col.field === 'estado') {
          td.className = isDentroDeCatalogo(value) ? 'status-good' : 'status-critical';
          td.textContent = isDentroDeCatalogo(value) ? 'Dentro de catálogo' : 'Fuera de catálogo';
        } else if (this.currentLog === 'premissort' && col.field === 'estado') {
          // Un "Encontrado" que en realidad fue reubicado (missort ya
          // corregido) se marca distinto de un hallazgo normal — sigue
          // siendo la razón de ser de la auditoría, no se diluye en verde.
          if (isMissort(record)) {
            td.className = 'status-warn';
            td.textContent = value === 'Encontrado' ? 'Encontrado (missort reubicado)' : value;
          } else if (isNoContenerizado(value)) {
            td.className = 'status-critical';
            td.textContent = 'No contenerizado';
          } else {
            td.className = value === 'Encontrado' ? 'status-good' : 'status-critical';
            td.textContent = value;
          }
        } else {
          td.textContent = value;
        }

        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  filterTable(query) {
    if (!query.trim()) {
      this.displayedCount = 10;
      this.render();
      return;
    }

    let filteredRecords = this.getFilteredRecords();
    if (this.chartFilter) filteredRecords = filteredRecords.filter(this.chartFilter.predicate);
    const columns = LOG_COLUMNS[this.currentLog] || [];
    const queryLower = query.toLowerCase();
    const searchResults = filteredRecords.filter(r => {
      const recordText = columns
        .map(col => String(r[col.field] || '').toLowerCase())
        .join(' ');
      return recordText.includes(queryLower);
    });

    this.renderTable(searchResults);

    const btnLoadMore = document.getElementById('btn-load-more');
    const paginationInfo = document.getElementById('pagination-info');
    btnLoadMore.style.display = 'none';
    paginationInfo.textContent = `${searchResults.length} resultado${searchResults.length !== 1 ? 's' : ''} encontrado${searchResults.length !== 1 ? 's' : ''}`;
  }
}

const viewer = new LogViewer();
</script>
